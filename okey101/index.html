</style></head><body>
<title>101 Okey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: 1280×800 sabit yatay masa, ekrana ölçeklenir. Üç kenarda rakipler, köşelerde atılan taşlar, ortada ızgaralı masa + çift sütunu, altta iki sıralı ahşap ıstaka. Tek tema: lacivert çuha. */
:root{
  --felt:#16466f; --felt-deep:#0c2a47; --board:#0d2440; --grid:rgba(120,170,220,.09);
  --wood:#d98a1c; --wood-hi:#f3b545; --wood-lo:#9a5a0c; --slot:rgba(90,45,0,.18);
  --ivory:#fbf7ee; --ivory-lo:#e4dccb;
  --t0:#d0242b; --t1:#e3a400; --t2:#1d8fd8; --t3:#141414; --tf:#1f9a52;
  --gold:#ffc84a; --ink:#f4f1ea; --muted:#9fb9d6; --good:#7ee39b; --bad:#ff6b5b;
  --o0:#ffc84a; --o1:#38d3c4; --o2:#c08bff; --o3:#ff9b52;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
@supports (height:100svh){html,body{height:100svh}}
body{background:var(--felt-deep);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.rot{display:none;text-align:center;font-size:14px;color:var(--muted);padding:6px 0 10px}
@media (orientation:portrait) and (max-width:700px){.rot{display:block}}
#wrap{position:relative;width:100%;height:calc(var(--s,1)*800px);margin:0 auto}
#stage{position:absolute;left:50%;top:0;width:1280px;height:800px;margin-left:-640px;transform-origin:top center;transform:scale(var(--s,1));
  border-radius:22px;overflow:hidden;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 0 2px,transparent 3px) 0 0/34px 34px,
    radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt-deep) 95%)}
.abs{position:absolute}

/* taş */
.tile{position:relative;width:100%;height:100%;border-radius:8px;border:0;padding:0;
  background:linear-gradient(180deg,#fff 0%,var(--ivory) 60%,var(--ivory-lo) 100%);
  box-shadow:0 3px 0 #c4b9a2,0 4px 7px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.24em;
  font-family:var(--body);font-weight:800;line-height:1;color:var(--t3);letter-spacing:-.04em}
.tile b{font-weight:800}
.tile i{display:block;width:30%;aspect-ratio:1;border-radius:50%;margin-top:auto;margin-bottom:12%;background:radial-gradient(circle at 40% 35%,#fff,#cfc7b8 70%);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.tile.c0{color:var(--t0)}.tile.c1{color:var(--t1)}.tile.c2{color:var(--t2)}.tile.c3{color:var(--t3)}
.tile.fake{color:var(--tf)}
.tile.joker::before{content:"";position:absolute;top:4px;right:4px;width:22%;aspect-ratio:1;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff,0 0 6px var(--gold)}
.tile.back{background:linear-gradient(180deg,#f2ecdf,#d9cfba)}
.lg{font-size:36px}.md{font-size:30px}.sm{font-size:19px}.xs{font-size:15px}
.sm,.xs{border-radius:4px;box-shadow:0 2px 0 #c4b9a2,0 2px 4px rgba(0,0,0,.3)}
.sm i,.xs i{display:none}
.sm,.xs{justify-content:center;padding-top:0}
.sm.joker::before{top:2px;right:2px;width:7px;box-shadow:0 0 0 1px #fff}

/* üst çubuk */
.tb{top:12px;display:flex;gap:8px;align-items:center}
.chip{height:36px;padding:0 14px;border-radius:10px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.chip.logo{font-family:var(--display);font-weight:400;font-size:18px;color:var(--gold)}
button.chip{cursor:pointer;font-family:var(--body)}
button.chip:hover{border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* oyuncu panelleri */
.pl{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(5,18,34,.72);border:2px solid rgba(255,255,255,.1);transition:border-color .2s,box-shadow .2s}
.pl.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,74,.25),0 0 22px rgba(255,200,74,.35)}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#0b1d31;flex:none}
.pl .nm{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.pl .nm b{font-size:16px}
.pl .nm span{font-size:13px;color:var(--muted)}
.pl.v{flex-direction:column;padding:10px 8px;gap:6px;text-align:center;width:96px}
.pl.v .nm{align-items:center}
.bub{position:absolute;min-width:58px;height:34px;padding:0 10px;border-radius:17px;background:#1b5fa3;border:2px solid #9fd0ff;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.4);white-space:nowrap}
.bub.pair{background:#6a3aa8;border-color:#d7b8ff}
.bar{height:5px;width:100%;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0}
.pl.on .bar i{animation:tick 20s linear forwards}
@keyframes tick{from{width:100%}to{width:0}}

/* köşe taşları */
.corner{width:56px;height:74px;border-radius:9px;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:stretch}
.corner.drop{border-color:var(--bad);border-style:solid;background:rgba(255,107,91,.12)}
.corner.drop.hot{background:rgba(255,107,91,.32)}
.corner.pick{border-color:var(--gold);border-style:solid;box-shadow:0 0 18px rgba(255,200,74,.5);cursor:pointer;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 4px rgba(255,200,74,.2)}}
.corner .tile.pop{animation:pop .35s}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.clbl{font-size:11px;color:var(--muted);text-align:center;width:90px;margin-left:-17px;margin-top:4px;letter-spacing:.04em}

/* masa */
.board{background:var(--board);border-radius:10px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 6px 18px rgba(0,0,0,.35);padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px 16px;overflow:hidden}
.set{display:flex;gap:2px;padding:2px 2px 5px;border-radius:5px;border-bottom:3px solid var(--oc,transparent);position:relative}
.set .tile{width:31px;height:41px}
.set .tile.joker{background:linear-gradient(180deg,#fff7d9 0%,#ffe08a 60%,#f2c24a 100%);box-shadow:0 2px 0 #b8892a,0 0 0 2px var(--gold),0 0 10px rgba(255,200,74,.7)}
.set .tile.joker::before{display:none}
.set .tile.joker::after{content:"OKEY";position:absolute;left:0;right:0;bottom:2px;text-align:center;font:800 7px/1 var(--body);letter-spacing:.02em;color:#8a5a00}
.set .tile.joker b{margin-top:-4px}
.board.dense .set .tile.joker::after{font-size:6px;bottom:1px}
.board.dense .set .tile{width:25px;height:33px;font-size:15px}
.board.d2 .set .tile{width:21px;height:28px;font-size:13px;border-radius:3px}
.board.d3 .set .tile{width:18px;height:24px;font-size:11px;border-radius:3px}
.board.d2 .set,.board.d3 .set{padding:1px 1px 3px;gap:1px}
.board.d2{gap:6px 8px}.board.d3{gap:4px 6px}
.board.over{overflow-y:auto}
.set.can{background:rgba(126,227,155,.18);box-shadow:0 0 0 2px var(--good);cursor:pointer}
.board.hot{box-shadow:inset 0 0 0 3px var(--good),inset 0 0 24px rgba(126,227,155,.35)}
.set.hot{background:rgba(126,227,155,.4)}
.pairs{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:8px 8px;padding:10px 8px}
.pairs::before{content:"ÇİFTLER";width:100%;font:800 11px/1 var(--body);letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.pairs .set{padding-bottom:4px}
.empty{color:rgba(159,185,214,.5);font-size:14px;margin:auto;text-align:center}
.ticker{left:256px;bottom:330px;width:508px;display:flex;flex-direction:column-reverse;gap:3px;pointer-events:none;align-items:center}
.ticker div{font-size:14px;font-weight:700;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:999px;white-space:nowrap;animation:fade 4s forwards}
.ticker div.hit{color:var(--gold)}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* sağ bilgi */
.info{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tag{height:30px;border-radius:7px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:13px;font-weight:700}
.tag.hot{background:#8f1f2a;border-color:#ff8a8a}
.deck{width:60px;height:80px;margin:0 auto;border-radius:9px;cursor:default;border:0;padding:0;background:none;position:relative}
.deck .tile{position:absolute;inset:0}
.deck .tile:nth-child(1){transform:translate(3px,-3px)}
.deck.pick{cursor:pointer}
.deck.pick .tile:last-of-type{box-shadow:0 3px 0 #c4b9a2,0 0 0 3px var(--gold),0 0 18px rgba(255,200,74,.6)}
.deck .n{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:800;font-size:15px;color:#555;z-index:2}
.gos{width:60px;height:80px;margin:0 auto}
.small{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.05em;text-transform:uppercase}

/* ıstaka */
.rack{left:178px;top:532px;width:924px;height:176px;border-radius:12px;
  background:linear-gradient(180deg,var(--wood-hi) 0%,var(--wood) 18%,#c97a12 50%,var(--wood-hi) 52%,var(--wood) 70%,var(--wood-lo) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.25),0 10px 26px rgba(0,0,0,.5);touch-action:none}
.rack.myturn{background:linear-gradient(180deg,#7fe0a0 0%,#2f9d5c 18%,#1f7a44 50%,#7fe0a0 52%,#2f9d5c 70%,#165a32 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 4px rgba(120,230,160,.55),0 0 34px rgba(80,220,130,.55),0 10px 26px rgba(0,0,0,.5);transition:background .3s,box-shadow .3s}
.rack.myturn::before,.rack.myturn::after{background:linear-gradient(90deg,#3f8a5c,#bff0cf,#3f8a5c)}
.pl.on{background:linear-gradient(180deg,rgba(47,157,92,.95),rgba(26,110,62,.95))!important;border-color:#8ff0b3!important}
.pl.on .nm b::after{content:var(--sirada," · SIRADA");color:#fff4c2;font-size:.8em}
.rack::before,.rack::after{content:"";position:absolute;top:8px;bottom:8px;width:10px;border-radius:4px;background:linear-gradient(90deg,#8c8c8c,#e6e6e6,#8c8c8c)}
.rack::before{left:4px}.rack::after{right:4px}
.slot{position:absolute;width:56px;height:76px;border-radius:8px}
.slot.over{background:rgba(255,255,255,.28)}
.slot .tile{cursor:grab;touch-action:none;transition:transform .12s}
.slot .tile.sel{transform:translateY(-10px);box-shadow:0 3px 0 #c4b9a2,0 0 0 3px #1b5fa3,0 10px 12px rgba(0,0,0,.4)}
.slot .tile.new{box-shadow:0 3px 0 #c4b9a2,0 0 0 3px var(--good),0 4px 7px rgba(0,0,0,.35)}
.slot .tile.isl::after{content:var(--isl,"İŞLEK");position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:800 9px/1 var(--body);letter-spacing:.04em;background:var(--bad);color:#fff;padding:2px 4px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.slot .tile.warn{box-shadow:0 3px 0 #c4b9a2,0 0 0 3px var(--bad),0 4px 7px rgba(0,0,0,.35)}
.slot .tile.dragging{opacity:.25}
.dghost{position:absolute;z-index:1000;pointer-events:none;transform:rotate(-4deg) scale(1.06);filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}

.me{left:520px;top:484px;width:240px;justify-content:center;padding:4px 12px 4px 4px}.me .av{width:34px;height:34px;font-size:16px;border-radius:9px}
.acts{left:178px;top:720px;width:924px;display:flex;gap:8px;align-items:center}
.btn{height:46px;padding:0 16px;border-radius:12px;border:0;font:700 16px/1 var(--body);cursor:pointer;color:#0b1d31;background:var(--ink);box-shadow:0 4px 0 #8a9bb0}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a9bb0}
.btn.blue{background:#2f86d6;color:#fff;box-shadow:0 4px 0 #134a80}
.btn.green{background:#3fb766;color:#fff;box-shadow:0 4px 0 #1d6b39}
.btn.purple{background:#8a52d6;color:#fff;box-shadow:0 4px 0 #4b2687}
.btn.red{background:#e2493b;color:#fff;box-shadow:0 4px 0 #8a2018}
.btn.ghost{background:rgba(0,0,0,.35);color:var(--ink);box-shadow:none;border:1.5px solid rgba(255,255,255,.18)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.status{left:178px;top:774px;width:924px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.status .bad{color:var(--bad)}.status b{color:var(--gold)}

/* katmanlar */
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(3,12,24,.72);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.sheet{width:min(100%,540px);margin:auto 0;background:#0f2c4b;border:2px solid var(--gold);border-radius:18px;padding:20px;box-shadow:0 10px 0 #061525;display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,30px);line-height:1.05;margin:0;color:var(--gold);text-wrap:balance}
.sheet p{margin:0;font-size:15px;line-height:1.5}
.sheet .muted{color:var(--muted);font-size:14px}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.3);border-radius:10px;padding:4px}
.seg button{font:700 15px/1.2 var(--body);border:0;border-radius:8px;min-height:44px;cursor:pointer;color:var(--ink);background:transparent}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1a05}
.rowb{display:flex;gap:8px;flex-wrap:wrap}.rowb .btn{flex:1 1 150px;height:50px}
.res{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.res th,.res td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
.res th:first-child,.res td:first-child{text-align:left}
.res td small{display:block;color:var(--muted);font-size:12px}
.hstrip.big{max-width:none;gap:4px}.hstrip.big .tile{width:30px;height:40px;font-size:18px}
.hstrip{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;max-width:330px}
.hstrip .tile{width:17px;height:23px;font-size:11px;border-radius:3px;justify-content:center;padding:0;box-shadow:0 1px 0 #c4b9a2}
.hstrip .tile i{display:none}
@media (max-height:520px){.sheet{padding:12px 14px;gap:8px;border-radius:14px}.sheet h2{font-size:20px}.res th,.res td{padding:3px 4px}.rowb .btn{height:42px}.sheet .muted{font-size:13px}}
.res thead th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.res td.win{color:var(--good);font-weight:800}
.res tr.tot td{font-family:var(--display);font-size:16px;font-weight:400}
.how{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.how b{color:var(--ink)}
.loglist{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.loglist li{padding-left:8px;border-left:3px solid rgba(255,255,255,.15)}
.loglist li.hit{border-left-color:var(--gold)}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:#3a0f0b;border:2px solid var(--bad);color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-weight:700;max-width:calc(100% - 32px);text-align:center;animation:tin .2s}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
/* hareket */
.fly{position:absolute;width:56px;height:76px;z-index:60;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.set.pop{animation:setpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes setpop{from{transform:translateY(-14px) scale(.6);opacity:0}}
.set.glow{animation:glow 1s}
@keyframes glow{0%,50%{box-shadow:0 0 0 2px var(--gold),0 0 16px var(--gold)}}
.slot .tile.deal{animation:deal .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes deal{from{transform:translateY(-120px) rotate(-10deg) scale(.7);opacity:0}}
.slot .tile.arriving{visibility:hidden}
@media (hover:hover){.slot .tile:not(.sel):hover{transform:translateY(-4px)}}
.rack.my{box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 3px var(--gold),0 0 30px rgba(255,200,74,.45),0 10px 26px rgba(0,0,0,.5)}
.banner{position:absolute;left:0;right:0;top:270px;text-align:center;pointer-events:none;z-index:70}
.banner span{display:inline-block;font-family:var(--display);font-size:46px;line-height:1;color:var(--gold);padding:12px 26px;border-radius:18px;background:rgba(5,18,34,.82);border:3px solid var(--gold);
  text-shadow:0 3px 0 #6b4a00;box-shadow:0 0 40px rgba(255,200,74,.45);animation:ban 1.6s forwards}
.banner.small span{font-size:28px;padding:8px 18px;border-width:2px}
.banner.bad span{color:var(--bad);border-color:var(--bad);text-shadow:0 3px 0 #5a0d06;box-shadow:0 0 40px rgba(255,107,91,.4)}
@keyframes ban{0%{transform:scale(.3) rotate(-6deg);opacity:0}18%{transform:scale(1.12) rotate(2deg);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.pl.on .av{animation:bob 1s ease-in-out infinite alternate}
.pl.on{animation:turnBlink 1s ease-in-out infinite}
.rack.myturn{animation:rackBlink 1s ease-in-out infinite}
@keyframes turnBlink{50%{filter:brightness(1.35);box-shadow:0 0 0 6px rgba(143,240,179,.55),0 0 28px rgba(143,240,179,.7)}}
@keyframes rackBlink{50%{filter:brightness(1.18);box-shadow:0 0 0 5px rgba(143,240,179,.6),0 0 30px rgba(143,240,179,.6)}}

@keyframes bob{to{transform:translateY(-3px) scale(1.06)}}
.deck .tile:last-of-type{transition:transform .15s}
.deck.pick:hover .tile:last-of-type{transform:translateY(-4px)}
/* ters koyup bitirme */
.ftile{position:absolute;width:56px;height:76px;z-index:65;perspective:500px;pointer-events:none}
.ftile .in{position:absolute;inset:0;transform-style:preserve-3d;animation:flipT .7s .1s ease-in-out forwards}
.ftile .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ftile .f.b{transform:rotateY(180deg)}
.ftile .f.b .tile{background:repeating-linear-gradient(45deg,#e7dcc4 0 6px,#d6c8a8 6px 12px);box-shadow:0 3px 0 #b5a27c,0 0 0 3px var(--gold),0 0 22px rgba(255,200,74,.6)}
.ftile .cap{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;font:800 12px/1 var(--body);letter-spacing:.06em;background:var(--gold);color:#2a1a05;padding:4px 8px;border-radius:6px;animation:capin .3s .8s both}
.ftile.ok .cap{background:var(--bad);color:#fff}
@keyframes flipT{to{transform:rotateY(180deg) rotate(-8deg)}}
@keyframes capin{from{opacity:0;transform:translate(-50%,-6px)}}
.deck.finish{box-shadow:0 0 0 3px var(--good),0 0 18px rgba(126,227,155,.6);border-radius:9px}
.deck.hot{box-shadow:0 0 0 4px var(--good),0 0 26px rgba(126,227,155,.8)}
/* okey ıstakada ters durur */
.slot .tile.joker,.dghost.joker{flex-direction:column-reverse;padding-top:0;padding-bottom:.24em}
.slot .tile.joker b,.dghost.joker b{transform:rotate(180deg)}
.slot .tile.joker i,.dghost.joker i{margin-top:12%;margin-bottom:auto}
.slot .tile.joker::before,.dghost.joker::before{top:auto;right:auto;bottom:4px;left:4px}
.tile.okeyb{background:linear-gradient(180deg,#fff 0%,#fbf8f1 60%,#ece6d8 100%)}
.tile.okeyb::before,.tile.okeyb::after{display:none!important}

/* Bungee küçük i'yi noktasız I çizer; büyük harfe dili bilerek çevir (tr: i→İ) */
.chip.logo,.sheet h2{text-transform:uppercase}

<script>
/* ===== 101 OKEY MOTORU ===== */
const NAMES=['Sen','Nuri','Rıza','Hamdi'];
const CN=['kırmızı','sarı','mavi','siyah'];
let S=null;
const RULES={rising:false};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeTiles(){const a=[];let id=0;
  for(let c=0;c<4;c++)for(let n=1;n<=13;n++)for(let k=0;k<2;k++)a.push({id:id++,c,n,fake:false});
  a.push({id:id++,c:-1,n:0,fake:true});a.push({id:id++,c:-1,n:0,fake:true});return a}
const eff=t=>t.fake?{c:S.okC,n:S.okN}:{c:t.c,n:t.n};
const wild=t=>!t.fake&&t.c===S.okC&&t.n===S.okN;
const tval=t=>wild(t)?101:eff(t).n;
const tname=t=>t.fake?`sahte okey`:wild(t)?`okey`:`${CN[t.c]} ${t.n}`;
const prev=s=>(s+3)%4,next=s=>(s+1)%4;
const ok=(x={})=>Object.assign({ok:true},x),err=m=>({ok:false,msg:m});

function dealHand(dealer,rig){
  const tiles=shuffle(makeTiles());
  const g=tiles.splice(tiles.findIndex(t=>!t.fake),1)[0];
  S={gosterge:g,okC:g.c,okN:g.n===13?1:g.n+1,deck:tiles,hands:[[],[],[],[]],discards:[[],[],[],[]],table:[],
    opened:[null,null,null,null],openVal:[0,0,0,0],pen:[0,0,0,0],penLog:[[],[],[],[]],turn:dealer,phase:'act',dealer,
    firstTurn:[true,true,true,true],minOpen:101,shown:[false,false,false,false],sideTile:null,laidThisTurn:false,openedThisTurn:false,ended:false,result:null};
  if(rig&&rig.all)rigHands(dealer);
  else for(let s=0;s<4;s++)S.hands[s]=S.deck.splice(0,RULES.classic?(s===dealer?15:14):(s===dealer?22:21));
  S.pairBot=-1;
  if(rig&&rig.pair){S.pairBot=1+(Math.random()*3|0);rigPairs(S.pairBot)}
  if(rig&&rig.ok)rigOkey(rig.ok);
}


/* test: tile yerini değiştir (deste ya da başka el) */
function locate(pred,skipSeat){
  for(let s=0;s<4;s++){if(s===skipSeat)continue;const i=S.hands[s].findIndex(pred);if(i>=0)return {arr:S.hands[s],i}}
  const i=S.deck.findIndex(pred);if(i>=0)return {arr:S.deck,i};return null;
}
function rigOkey(k){
  const h=S.hands[0];let have=h.filter(wild).length;
  while(have<k){const loc=locate(wild,0);if(!loc)break;
    const j=h.findIndex(t=>!wild(t)&&!t.fake);const tmp=h[j];h[j]=loc.arr[loc.i];loc.arr[loc.i]=tmp;have++}
}
function rigPairs(s){
  const h=S.hands[s],keep=new Set(),want=7;let made=0;
  // var olan çiftleri say
  const seen={};for(const t of h){if(wild(t)||t.fake)continue;const k=t.c+'-'+t.n;if(seen[k]){keep.add(t.id);keep.add(seen[k].id);made++;delete seen[k]}else seen[k]=t}
  for(const t of h.slice()){if(made>=want)break;if(!h.includes(t)||wild(t)||t.fake||keep.has(t.id))continue;
    const loc=locate(x=>!wild(x)&&!x.fake&&x.c===t.c&&x.n===t.n&&x.id!==t.id,s);if(!loc||loc.arr===S.hands[0])continue;
    const j=h.findIndex(x=>x!==t&&!keep.has(x.id)&&!wild(x));if(j<0)break;
    const tmp=h[j];h[j]=loc.arr[loc.i];loc.arr[loc.i]=tmp;keep.add(t.id);keep.add(h[j].id);made++}
}
/* test eli: herkese 101'i geçen seriler */
function rigHands(dealer){
  const pool=S.deck;
  const take=(c,n)=>{const i=pool.findIndex(t=>!t.fake&&t.c===c&&t.n===n&&!wild(t));return i<0?null:pool.splice(i,1)[0]};
  for(let s=0;s<4;s++){
    const h=[];let val=0,guard=0;
    const goal=103+(Math.random()*8|0),size=(s===dealer?22:21)-4;
    while(val<goal&&guard++<400){
      const c=Math.random()*4|0,len=3+(Math.random()*4|0),lo=guard<80?5:1,st=lo+(Math.random()*(14-len-lo+1)|0);
      if(Math.random()<.3){ // per
        const n=(guard<80?8:3)+(Math.random()*(guard<80?6:11)|0),cs=shuffle([0,1,2,3]).slice(0,3+(Math.random()*2|0)),got=[];
        for(const cc of cs){const t=take(cc,n);if(t)got.push(t)}
        if(got.length>=3&&h.length+got.length<=size){h.push(...got);val+=n*got.length}else pool.push(...got);
      }else{
        const got=[];for(let n=st;n<st+len;n++){const t=take(c,n);if(!t)break;got.push(t)}
        if(got.length===len&&h.length+got.length<=size){h.push(...got);val+=got.reduce((a,t)=>a+t.n,0)}else pool.push(...got);
      }
    }
    S.hands[s]=h;
  }
  shuffle(pool);
  for(let s=0;s<4;s++){const h=S.hands[s],need=(s===dealer?22:21)-h.length;h.push(...pool.splice(0,Math.max(0,need)));S.hands[s]=shuffle(h)}
  shuffle(pool);
}

/* --- dizi doğrulama --- */
function validate(ts){
  if(ts.length<3)return null;
  const N=ts.filter(t=>!wild(t)).map(t=>eff(t));if(!N.length)return null;
  let best=null;
  if(ts.length<=4&&N.every(e=>e.n===N[0].n)){
    const cs=new Set(N.map(e=>e.c));
    if(cs.size===N.length){const n=N[0].n,free=[0,1,2,3].filter(c=>!cs.has(c));let fi=0;
      const reps=ts.map(t=>wild(t)?{c:free[fi++],n}:eff(t));best={type:'group',value:n*ts.length,reps}}
  }
  if(N.every(e=>e.c===N[0].c)){
    const ns=N.map(e=>e.n).sort((a,b)=>a-b);
    if(new Set(ns).size===ns.length){
      const L=ts.length,lo=ns[0],hi=ns[ns.length-1];
      if(hi-lo+1<=L&&L<=13){
        const s=Math.min(lo,14-L);
        if(s+L-1>=hi&&s>=1){const c=N[0].c,need=[];for(let n=s;n<s+L;n++)if(!ns.includes(n))need.push(n);let k=0;
          const reps=ts.map(t=>wild(t)?{c,n:need[k++]}:eff(t));const value=L*(2*s+L-1)/2;
          if(!best||value>best.value)best={type:'run',value,reps}}
      }
    }
  }
  return best;
}
function validPair(g){if(g.length!==2)return false;const[a,b]=g;if(wild(a)||wild(b))return true;const x=eff(a),y=eff(b);return x.c===y.c&&x.n===y.n}
function pairValue(g){const n=g.filter(t=>!wild(t));return n.length?eff(n[0]).n*2:0}
function canAttach(set,t){if(set.type==='pair')return false;const v=validate([...set.tiles,t]);return !!v&&v.type===set.type}
const pairsOnTable=()=>S.table.some(x=>x.type==='pair');
const canAttachAny=t=>S.table.some(st=>canAttach(st,t));
function canShow(s){return S.turn===s&&S.firstTurn[s]&&!S.shown[s]&&S.hands[s].some(t=>!t.fake&&t.c===S.gosterge.c&&t.n===S.gosterge.n)}
function mkSet(owner,tiles,v){
  const o=tiles.map((t,i)=>({t,r:v.reps?v.reps[i]:null}));
  if(v.type==='run')o.sort((a,b)=>a.r.n-b.r.n);else if(v.type==='group')o.sort((a,b)=>a.r.c-b.r.c);
  return {owner,type:v.type,value:v.value,tiles:o.map(x=>x.t),reps:o.map(x=>x.r)};
}

/* --- hamleler --- */
function draw(s,from){
  if(S.ended||S.turn!==s||S.phase!=='draw')return err('Şu an taş çekemezsin');
  let t;
  if(from==='side'){if(S.noSide)return err('Geri bıraktığın taşı tekrar alamazsın, ortadan çek');const p=S.discards[prev(s)];if(!p.length)return err('Yanda alınacak taş yok');t=p.pop();S.sideTile=t.id}
  else{if(!S.deck.length)return err('Deste bitti');t=S.deck.shift()}
  S.hands[s].push(t);S.phase='act';return ok({tile:t});
}
function returnSide(s){
  if(S.turn!==s||S.sideTile==null)return err('Geri bırakılacak yan taş yok');
  const h=S.hands[s],i=h.findIndex(t=>t.id===S.sideTile);if(i<0)return err('Taş elinde değil');
  S.discards[prev(s)].push(h.splice(i,1)[0]);S.sideTile=null;S.phase='draw';S.noSide=true;return ok();
}
function showGosterge(s){if(!canShow(s))return err('Gösterge gösterilemez');S.shown[s]=true;const v=RULES.classic?1:101;S.pen[s]-=v;S.penLog[s].push('Gösterge −'+v);return ok()}
function lay(s,groupsIds){
  if(S.ended||S.turn!==s||S.phase!=='act')return err('Sıra sende değil');
  const h=S.hands[s],seen=new Set();
  const groups=groupsIds.map(g=>g.map(id=>{if(seen.has(id))return null;seen.add(id);return h.find(t=>t.id===id)}));
  if(!groups.length||groups.flat().some(t=>!t))return err('Taşlar elinde yok');
  const op=S.opened[s],isPair=groups.every(g=>g.length===2);
  if(!isPair&&groups.some(g=>g.length===2))return err('Çiftle seri aynı anda açılmaz');
  let vals;
  if(isPair){
    if(op==='sets'&&!pairsOnTable())return err('Masada çift açan yok, seriyle açan çift koyamaz');
    if(!groups.every(validPair))return err('Geçersiz çift var');
    if(!op&&groups.length<5)return err(`Çiftle açmak için 5 çift lazım, ${groups.length} var`);
    vals=groups.map(g=>({type:'pair',value:pairValue(g),reps:null}));
  }else{
    if(op==='pairs')return err('Çiftle açtın, sadece çift koyabilirsin');
    vals=groups.map(validate);if(vals.some(v=>!v))return err('Geçersiz dizi var');
    const tot=vals.reduce((a,v)=>a+v.value,0);if(!op&&tot<S.minOpen)return err(`Açmak için ${S.minOpen} lazım, ${tot} var`);
  }
  if(h.length-seen.size<1)return err('Atmak için elinde en az bir taş kalmalı');
  if(!op&&groups.every(g=>g.length===2)&&h.length-seen.size<2)return err('Çifte giden aynı elde bitemez: elinde en az 2 taş kalmalı');
  groups.forEach((g,i)=>S.table.push(mkSet(s,g,vals[i])));
  S.hands[s]=h.filter(t=>!seen.has(t.id));
  const total=vals.reduce((a,v)=>a+v.value,0);
  if(!op){S.opened[s]=isPair?'pairs':'sets';S.openVal[s]=isPair?groups.length:total;S.openedThisTurn=true;if(!isPair&&RULES.rising)S.minOpen=Math.max(S.minOpen,total+1)}
  if(seen.has(S.sideTile))S.sideTile=null;
  S.laidThisTurn=true;return ok({total,isPair,opened:!op});
}
function attach(s,tileId,si){
  if(S.ended||S.turn!==s||S.phase!=='act')return err('Sıra sende değil');
  if(!S.opened[s])return err('İşlemek için önce açmalısın');
  const set=S.table[si],h=S.hands[s],t=h.find(x=>x.id===tileId);
  if(!t||!set)return err('Taş ya da dizi bulunamadı');
  if(h.length<=1)return err('Atmak için bir taş kalmalı');
  if(set.type==='pair')return err('Çiftlere işlenmez');
  const v=validate([...set.tiles,t]);if(!v||v.type!==set.type)return err('Bu taş o diziye uymuyor');
  S.table[si]=mkSet(set.owner,[...set.tiles,t],v);S.hands[s]=h.filter(x=>x!==t);
  if(t.id===S.sideTile)S.sideTile=null;S.laidThisTurn=true;return ok();
}
function discard(s,tileId,force){
  if(S.ended||S.turn!==s||S.phase!=='act')return err('Şu an taş atamazsın');
  const h=S.hands[s],t=h.find(x=>x.id===tileId);if(!t)return err('Taş elinde yok');
  const res={pen:[]};
  if(!RULES.classic&&S.sideTile!=null&&h.some(x=>x.id===S.sideTile)){
    if(!force)return err('Yandan aldığın taşı bu el kullanmalısın ya da geri bırakmalısın');
    S.pen[s]+=101;S.penLog[s].push('Yandan alıp kullanmama +101');res.pen.push('yandan');
  }
  S.hands[s]=h.filter(x=>x!==t);
  const finishing=S.hands[s].length===0;
  if(!finishing&&!RULES.classic){
    if(wild(t)){S.pen[s]+=101;S.penLog[s].push('Okey atma +101');res.pen.push('okey')}
    else if(canAttachAny(t)){S.pen[s]+=101;S.penLog[s].push('İşlek taş atma +101');res.pen.push('işlek')}
  }
  S.discards[s].push(t);S.firstTurn[s]=false;res.tile=t;
  if(finishing){res.finished=true;endHand(s,{okey:wild(t),elden:S.openedThisTurn})}
  else{
    S.turn=next(s);S.phase='draw';S.sideTile=null;S.noSide=false;S.laidThisTurn=false;S.openedThisTurn=false;
    if(!S.deck.length){res.deckOut=true;endHand(null,{})}
  }
  return ok(res);
}
function endHand(fin,f){
  if(RULES.classic){const m=(f.okey?2:1)*(f.pairs?2:1),rows=[];for(let s=0;s<4;s++){const base=s===fin?-2*m:0;rows.push({base,how:s===fin?(f.pairs?'Çiftle bitirdi':'Bitirdi'):fin==null?'Orta bitti':'—',pen:S.pen[s],total:base+S.pen[s]})}
    S.ended=true;S.result={fin,m,flags:f,pairsFin:!!f.pairs,rows};return}
  const pairsFin=fin!=null&&S.opened[fin]==='pairs';
  const m=fin==null?1:(pairsFin?2:1)*(f.okey?2:1)*(f.elden?2:1);
  const rows=[];
  for(let s=0;s<4;s++){
    let base,how;
    if(s===fin){base=-101*m;how='Bitirdi'}
    else if(fin==null){const k=S.hands[s].filter(wild).length;base=k*101;how=k?'Orta bitti · elde okey':'Orta bitti'}   // deste bitince el puansız, sadece elde okey tutan 101 yer
    else if(!S.opened[s]){base=202*m;how='Açamadı'}
    else{const rem=S.hands[s].reduce((a,t)=>a+tval(t),0),k=S.opened[s]==='pairs'?2:1;base=rem*k*m;how=`Elde ${rem}${k>1?' ×2 (çift)':''}`}
    rows.push({base,how,pen:S.pen[s],total:base+S.pen[s]});
  }
  S.ended=true;S.result={fin,m,flags:f,pairsFin,rows};
}


/* --- işlek listesi ve okey alma --- */
function islekKeys(){
  const out=[];if(!S.table.some(st=>st.type!=='pair'))return out;
  for(let c=0;c<4;c++)for(let n=1;n<=13;n++){if(c===S.okC&&n===S.okN)continue;
    if(canAttachAny({id:-1,c,n,fake:false}))out.push({c,n})}
  return out;
}
function jokerIndex(set,t){
  if(set.type==='pair'||wild(t))return -1;const e=eff(t);
  return set.tiles.findIndex((x,i)=>wild(x)&&set.reps[i]&&set.reps[i].c===e.c&&set.reps[i].n===e.n);
}
function canSwap(set,t){const k=jokerIndex(set,t);if(k<0)return false;const nt=set.tiles.slice();nt[k]=t;const v=validate(nt);return !!v&&v.type===set.type}
function swapJoker(s,tileId,si){
  if(S.ended||S.turn!==s||S.phase!=='act')return err('Sıra sende değil');
  if(!S.opened[s])return err('Okeyi almak için önce açmalısın');
  const set=S.table[si],h=S.hands[s],t=h.find(x=>x.id===tileId);if(!set||!t)return err('Taş ya da dizi bulunamadı');
  const k=jokerIndex(set,t);if(k<0)return err('Bu dizide bu taşın yerini tutan okey yok');
  const nt=set.tiles.slice(),j=nt[k];nt[k]=t;const v=validate(nt);if(!v||v.type!==set.type)return err('Okey alınamıyor');
  S.table[si]=mkSet(set.owner,nt,v);S.hands[s]=h.filter(x=>x!==t).concat([j]);
  if(t.id===S.sideTile)S.sideTile=null;S.laidThisTurn=true;return ok({joker:j});
}

/* --- dizi bulucu --- */
function subsets(a){const out=[];const n=a.length;for(let m=1;m<(1<<n);m++){const s=[];for(let i=0;i<n;i++)if(m&(1<<i))s.push(a[i]);out.push(s)}return out}
function candidates(ts){
  const W=ts.filter(wild),N=ts.filter(t=>!wild(t)),out=[];
  for(let c=0;c<4;c++){
    const byN={};N.forEach(t=>{const e=eff(t);if(e.c===c)(byN[e.n]=byN[e.n]||[]).push(t)});
    for(let s=1;s<=11;s++){let miss=0;const picks=[];
      for(let e=s;e<=13;e++){if(byN[e])picks.push(byN[e][0]);else miss++;
        if(miss>W.length)break;const L=e-s+1;
        if(L>=3&&picks.length>=2&&byN[s])
          out.push({tiles:[...picks,...W.slice(0,miss)],value:L*(s+e)/2});
      }}
  }
  for(let n=1;n<=13;n++){
    const byC={};N.forEach(t=>{const e=eff(t);if(e.n===n&&!byC[e.c])byC[e.c]=t});
    const av=Object.values(byC);if(!av.length)continue;
    for(const sub of subsets(av))for(let j=0;j<=Math.min(W.length,2);j++){const L=sub.length+j;
      if(L<3||L>4||sub.length<2)continue;out.push({tiles:[...sub,...W.slice(0,j)],value:n*L})}
  }
  return out;
}
/* kesin arama: el içindeki en yüksek toplamlı dizileri bulur (dal-sınır) */
function exactSets(ts,budgetMs){
  const cnt=[...Array(4)].map(()=>Array(14).fill(0)),lists={},W=[];
  for(const t of ts){if(wild(t)){W.push(t);continue}const e=eff(t);cnt[e.c][e.n]++;(lists[e.c*14+e.n]=lists[e.c*14+e.n]||[]).push(t)}
  let remSum=0;for(let c=0;c<4;c++)for(let n=1;n<=13;n++)remSum+=cnt[c][n]*n;
  let w=W.length,best=0,bestPick=[],pick=[];const t0=Date.now();let nodes=0,timeout=false;
  // desen: {kind,c,n|s,L,real:[[c,n]...],wilds,value}
  function patternsFor(c,n){
    const out=[];
    // seriler: c rengi, n'yi içeren
    for(let s=Math.max(1,n-12);s<=n;s++)for(let L=Math.max(3,n-s+1);s+L-1<=13;L++){
      let miss=0;const real=[];for(let k=s;k<s+L;k++){if(cnt[c][k]>0)real.push(k);else miss++}
      if(miss>w)continue;if(!real.includes(n))continue;
      out.push({run:true,c,s,L,real,miss,value:L*(2*s+L-1)/2});
    }
    // perler: n sayısı, c rengini içeren
    const cols=[0,1,2,3].filter(x=>x!==c&&cnt[x][n]>0);
    for(let m=0;m<(1<<cols.length);m++){const sub=[c];cols.forEach((x,i)=>{if(m&(1<<i))sub.push(x)});
      for(let j=0;j<=Math.min(w,2);j++){const L=sub.length+j;if(L<3||L>4)continue;out.push({run:false,n,cols:sub,miss:j,value:n*L})}}
    out.sort((a,b)=>b.value-a.value);return out;
  }
  function apply(p,d){if(p.run){for(const k of p.real){cnt[p.c][k]-=d;remSum-=d*k}}else{for(const x of p.cols){cnt[x][p.n]-=d;remSum-=d*p.n}}w-=d*p.miss}
  function dfs(cur){
    if(timeout)return;if((++nodes&1023)===0&&Date.now()-t0>budgetMs){timeout=true;return}
    if(cur>best){best=cur;bestPick=pick.slice()}
    if(cur+remSum+w*13<=best)return;
    let fc=-1,fn=-1;
    outer:for(let n=13;n>=1;n--)for(let c=0;c<4;c++)if(cnt[c][n]>0){fc=c;fn=n;break outer}
    if(fc<0)return;
    for(const p of patternsFor(fc,fn)){apply(p,1);pick.push(p);dfs(cur+p.value);pick.pop();apply(p,-1);if(timeout)return}
    // bu taşı kullanma
    cnt[fc][fn]--;remSum-=fn;dfs(cur);cnt[fc][fn]++;remSum+=fn;
  }
  dfs(0);
  // desenleri gerçek taşlara çevir
  const pools={};for(const k in lists)pools[k]=lists[k].slice();const wp=W.slice();
  const sets=[];
  for(const p of bestPick){const g=[];
    if(p.run){for(let k=p.s;k<p.s+p.L;k++){const pl=pools[p.c*14+k];if(pl&&pl.length&&p.real.includes(k))g.push(pl.pop());else g.push(wp.pop())}}
    else{for(const x of p.cols)g.push(pools[x*14+p.n].pop());for(let j=0;j<p.miss;j++)g.push(wp.pop())}
    if(g.every(Boolean)&&validate(g))sets.push(g)}
  const value=sets.reduce((a,g)=>a+validate(g).value,0);
  return {sets,value,used:new Set(sets.flat().map(t=>t.id)),timeout};
}
function bestSets(ts,iters=30){
  const ex=exactSets(ts,iters>=30?60:25);
  const g=greedySets(ts,ex.timeout?iters:4);
  return ex.value>=g.value?ex:g;
}
function greedySets(ts,iters=30){
  let best={sets:[],value:0,used:new Set()};
  for(let it=0;it<iters;it++){
    let pool=ts.slice();const sets=[];let val=0;
    for(;;){const cs=candidates(pool);if(!cs.length)break;
      cs.sort((a,b)=>b.value/b.tiles.length*0.3+b.value-(a.value/a.tiles.length*0.3+a.value));
      const k=it===0?0:Math.floor(Math.random()*Math.min(it<iters/2?2:4,cs.length));
      const ch=cs[k];sets.push(ch.tiles);val+=ch.value;const ids=new Set(ch.tiles.map(t=>t.id));pool=pool.filter(t=>!ids.has(t.id))}
    if(val>best.value)best={sets,value:val,used:new Set(sets.flat().map(t=>t.id))};
  }
  return best;
}
function bestPairs(ts){
  const W=ts.filter(wild),map={},singles=[],pairs=[];
  ts.filter(t=>!wild(t)).forEach(t=>{const e=eff(t),k=e.c+'-'+e.n;(map[k]=map[k]||[]).push(t)});
  for(const k in map){const a=map[k].slice();while(a.length>=2)pairs.push([a.pop(),a.pop()]);if(a.length)singles.push(a[0])}
  singles.sort((a,b)=>eff(b).n-eff(a).n);const w=W.slice();
  while(w.length&&singles.length)pairs.push([singles.shift(),w.pop()]);
  if(w.length===2)pairs.push([w.pop(),w.pop()]);
  return {pairs,singles};
}
function trimKeep(sets,handLen){
  sets=sets.map(g=>g.slice());
  while(sets.length&&sets.flat().length>=handLen){
    let done=false;
    for(let gi=0;gi<sets.length&&!done;gi++){const g=sets[gi];if(g.length<4)continue;
      for(const i of[g.length-1,0]){const g2=g.filter((_,k)=>k!==i);if(validate(g2)){sets[gi]=g2;done=true;break}}}
    if(!done){let mi=0;sets.forEach((g,i)=>{if(validate(g).value<validate(sets[mi]).value)mi=i});sets.splice(mi,1)}
  }
  return sets;
}
const setsVal=sets=>sets.reduce((a,g)=>a+validate(g).value,0);


/* ===== KLASİK OKEY: masaya açma yok; 14 taşın hepsi per/seri ya da 7 çift olunca 15. taşı ortaya atıp biter ===== */
function runOptions(t,rem,w){const e=eff(t),out=[];const c=e.c;
  for(let lead=0;lead<=w;lead++){const s0=e.n-lead;if(s0<1)break;
    for(let L=Math.max(3,lead+1);s0+L-1<=13;L++){const used=[t],pool=rem.slice();let need=lead,ok=true;
      for(let k=e.n+1;k<s0+L;k++){const i=pool.findIndex(x=>{const f=eff(x);return f.c===c&&f.n===k});if(i>=0){used.push(pool[i]);pool.splice(i,1)}else need++}
      if(need>w){if(need-w>1)break;continue}out.push({tiles:used,wilds:need})}}
  /* Klasik Okey: 12-13-1 gibi 13'ten 1'e bir kez dönen seri geçerli (1 sadece sonda) */
  if(RULES.classic&&e.n===1)for(let L=3;L<=13;L++){const used=[t],pool=rem.slice();let need=0;
    for(let k=14-L+1;k<=13;k++){const i=pool.findIndex(x=>{const f=eff(x);return f.c===c&&f.n===k});if(i>=0){used.push(pool[i]);pool.splice(i,1)}else need++}
    if(need<=w)out.push({tiles:used,wilds:need})}
  return out}
function groupOptions(t,rem,w){const e=eff(t),others=[],seenC=new Set([e.c]),out=[];
  for(const x of rem){const f=eff(x);if(f.n===e.n&&!seenC.has(f.c)){seenC.add(f.c);others.push(x)}}
  const n=others.length;for(let m=0;m<(1<<n);m++){const sub=[t];others.forEach((x,i)=>{if(m&(1<<i))sub.push(x)});for(let j=0;j<=Math.min(w,2);j++){const L=sub.length+j;if(L>=3&&L<=4)out.push({tiles:sub,wilds:j})}}
  return out}
function partition(ts){const W=ts.filter(wild),N=ts.filter(t=>!wild(t)).sort((a,b)=>eff(a).c-eff(b).c||eff(a).n-eff(b).n);let nodes=0;
  function rec(rem,w,acc){if(++nodes>40000)return null;if(!rem.length)return w===0?acc:null;
    const t=rem[0],rest=rem.slice(1);
    for(const o of [...runOptions(t,rest,w),...groupOptions(t,rest,w)]){const ids=new Set(o.tiles.map(x=>x.id));const r=rec(rest.filter(x=>!ids.has(x.id)),w-o.wilds,[...acc,{tiles:o.tiles,wilds:o.wilds}]);if(r)return r}
    return null}
  const r=rec(N,W.length,[]);if(!r)return null;const wp=W.slice();return r.map(g=>{const out=g.tiles.slice();for(let j=0;j<g.wilds;j++)out.push(wp.pop());return out})}
function sevenPairs(ts){if(ts.length!==14)return false;const W=ts.filter(wild).length,map={};let singles=0;
  ts.filter(t=>!wild(t)).forEach(t=>{const e=eff(t),k=e.c+'-'+e.n;map[k]=(map[k]||0)+1});for(const k in map)singles+=map[k]%2;return singles<=W&&(W-singles)%2===0}
function finishPlan(h){const opts=h.slice().sort((a,b)=>(wild(b)?1:0)-(wild(a)?1:0));
  for(const t of opts){const rest=h.filter(x=>x!==t);if(partition(rest))return {tile:t,pairs:false};if(sevenPairs(rest))return {tile:t,pairs:true}}return null}
function finishClassic(s,tileId){if(S.ended||S.turn!==s||S.phase!=='act')return err('Şu an bitemezsin');
  const h=S.hands[s],t=h.find(x=>x.id===tileId);if(!t)return err('Taş elinde yok');const rest=h.filter(x=>x!==t);
  const pairs=!partition(rest)&&sevenPairs(rest);if(!pairs&&!partition(rest))return err('Elin bitmeye hazır değil: kalan 14 taş per, seri ya da 7 çift olmalı');
  S.hands[s]=rest;S.discards[s].push(t);S.finTile=t;endHand(s,{okey:wild(t),pairs});return ok({finished:true,tile:t})}
function maxCover(ts){const W=ts.filter(wild),N=ts.filter(t=>!wild(t)).sort((a,b)=>eff(a).c-eff(b).c||eff(a).n-eff(b).n);let nodes=0,best=0;
  function rec(rem,w,cov){if(++nodes>6000)return;if(cov+rem.length+w<=best)return;if(cov>best)best=cov;if(!rem.length){best=Math.max(best,cov+0);return}
    const t=rem[0],rest=rem.slice(1);
    for(const o of [...runOptions(t,rest,w),...groupOptions(t,rest,w)]){const ids=new Set(o.tiles.map(x=>x.id));rec(rest.filter(x=>!ids.has(x.id)),w-o.wilds,cov+o.tiles.length+o.wilds)}
    rec(rest,w,cov)}
  rec(N,W.length,0);
  // çift potansiyeli
  const map={};N.forEach(t=>{const e=eff(t),k=e.c+'-'+e.n;map[k]=(map[k]||0)+1});let pr=0;for(const k in map)pr+=Math.floor(map[k]/2);
  return Math.max(best,Math.min(14,pr*2+W.length*2)*.8)}
function nearScore(t,h){if(wild(t))return 99;const e=eff(t);let v=0;for(const x of h){if(x===t||wild(x))continue;const f=eff(x);if(f.c===e.c&&Math.abs(f.n-e.n)<=2&&f.n!==e.n)v+=3-Math.abs(f.n-e.n);if(f.n===e.n&&f.c!==e.c)v+=1.5;if(f.n===e.n&&f.c===e.c)v+=.6}return v}
function* botTurnClassic(s){const nm=NAMES[s];yield {quiet:true};
  if(canShow(s)){showGosterge(s);yield {msg:`${nm} göstergeyi gösterdi.`,hit:true}}
  if(S.phase==='draw'){const p=S.discards[prev(s)],h=S.hands[s];let take=false;
    if(p.length){const t=p[p.length-1];take=wild(t)||maxCover([...h,t])>maxCover(h)+1.5}
    if(take){const r=draw(s,'side');yield {msg:`${nm} yandan ${tname(r.tile)} aldı.`}}else{if(!S.deck.length){endHand(null,{});return}draw(s,'deck');yield {quiet:true}}}
  const h=S.hands[s],plan=finishPlan(h);
  if(plan){finishClassic(s,plan.tile.id);yield {msg:`${nm} bitti!`,hit:true,discard:true};return}
  let best=null,bv=-1e9;for(const t of h){if(wild(t))continue;const rest=h.filter(x=>x!==t);const v=maxCover(rest)*3+nearScore(t,h)*-.6+(t.id===S.sideTile?-50:0)-(t.fake?5:0);if(v>bv){bv=v;best=t}}
  if(!best)best=h[h.length-1];const r=discard(s,best.id,true);yield {msg:`${nm} ${tname(best)} attı.`,discard:true}}
/* --- bot --- */
function botTakeSide(s){
  const p=S.discards[prev(s)];if(!p.length)return false;
  const t=p[p.length-1],h=S.hands[s],op=S.opened[s];
  if(op==='sets'){if(canAttachAny(t))return true;if(pairsOnTable()&&!wild(t)&&h.some(u=>!wild(u)&&eff(u).c===eff(t).c&&eff(u).n===eff(t).n))return true;return candidates([...h,t]).some(c=>c.tiles.includes(t)&&c.tiles.length<=h.length-1)}
  if(op==='pairs')return canAttachAny(t)||wild(t)||h.some(u=>!wild(u)&&eff(u).c===eff(t).c&&eff(u).n===eff(t).n);
  const b=bestSets([...h,t],30),sets=trimKeep(b.sets,h.length+1);
  if(setsVal(sets)>=S.minOpen&&sets.flat().some(x=>x.id===t.id))return {sets};
  let pairs=bestPairs([...h,t]).pairs;while(pairs.length&&pairs.flat().length>=h.length)pairs.pop();
  if(pairs.length>=5&&pairs.some(g=>g.includes(t))&&b.value<S.minOpen)return {pairs};
  return false;
}
function botPickDiscard(s){
  const h=S.hands[s];if(h.length===1)return h[0];
  const op=S.opened[s],used=op?new Set():bestSets(h,15).used;
  let cand=h.filter(t=>!wild(t)&&t.id!==S.sideTile);
  if(!cand.length)cand=h.slice();
  let best=cand[0],bs=1e9;
  for(const t of cand){const e=eff(t);let sc=0;
    if(canAttachAny(t))sc+=1000;
    if(used.has(t.id))sc+=60;
    for(const u of h){if(u===t||wild(u))continue;const f=eff(u);
      if(f.c===e.c&&f.n!==e.n&&Math.abs(f.n-e.n)<=2)sc+=3-Math.abs(f.n-e.n);
      if(f.n===e.n&&f.c!==e.c)sc+=2;
      if(f.n===e.n&&f.c===e.c)sc+=op==='pairs'?6:1.5}
    sc+=op?-e.n*.25:e.n*.04;
    if(sc<bs){bs=sc;best=t}}
  return best;
}
function* botTurn(s){
  if(RULES.classic){yield* botTurnClassic(s);return}
  const nm=NAMES[s];let plan=null;
  yield {quiet:true};
  if(canShow(s)){showGosterge(s);yield {msg:`${nm} göstergeyi gösterdi (−101).`,hit:true}}
  if(S.phase==='draw'){
    plan=botTakeSide(s);
    if(plan){const r=draw(s,'side');yield {msg:`${nm} yandan ${tname(r.tile)} aldı.`}}
    else{draw(s,'deck');yield {quiet:true}}
  }
  const h=()=>S.hands[s];
  if(!S.opened[s]&&plan&&plan!==true){
    const g=plan.sets||plan.pairs,r=lay(s,g.map(x=>x.map(t=>t.id)));
    if(r.ok)yield {msg:plan.sets?`${nm} ${r.total} puanla açtı!`:`${nm} ${g.length} çiftle açtı!`,hit:true};
  }
  if(!S.opened[s]&&S.pairBot===s){let pairs=bestPairs(h()).pairs;while(pairs.length&&pairs.flat().length>=h().length-1)pairs.pop();
    if(pairs.length>=5){const r=lay(s,pairs.map(g=>g.map(t=>t.id)));if(r.ok)yield {msg:`${nm} ${pairs.length} çiftle açtı!`,hit:true}}}
  if(!S.opened[s]){
    const b=bestSets(h(),40),sets=trimKeep(b.sets,h().length),tot=setsVal(sets);
    if(tot>=S.minOpen){const r=lay(s,sets.map(g=>g.map(t=>t.id)));if(r.ok)yield {msg:`${nm} ${tot} puanla açtı!`,hit:true}}
    else{let pairs=bestPairs(h()).pairs;while(pairs.length&&pairs.flat().length>=h().length-1)pairs.pop();
      if(pairs.length>=5&&(pairs.length>=6||b.value<70)){const r=lay(s,pairs.map(g=>g.map(t=>t.id)));if(r.ok)yield {msg:`${nm} ${pairs.length} çiftle açtı!`,hit:true}}}
  }else if(S.opened[s]==='sets'){
    for(const t of h().slice())for(let i=0;i<S.table.length;i++){const nmT=tname(t);if(swapJoker(s,t.id,i).ok){yield {msg:`${nm} ${nmT} koyup masadaki okeyi aldı!`,hit:true,swap:true};break}}
    const b=bestSets(h(),25);if(b.sets.length){const sets=trimKeep(b.sets,h().length);
      if(sets.length&&lay(s,sets.map(g=>g.map(t=>t.id))).ok)yield {msg:`${nm} masaya ${sets.length} dizi daha koydu.`}}
  }else{
    for(const t of h().slice())for(let i=0;i<S.table.length;i++){const nmT=tname(t);if(swapJoker(s,t.id,i).ok){yield {msg:`${nm} ${nmT} koyup masadaki okeyi aldı!`,hit:true,swap:true};break}}
    let pairs=bestPairs(h()).pairs;while(pairs.length&&pairs.flat().length>=h().length)pairs.pop();
    if(pairs.length&&lay(s,pairs.map(g=>g.map(t=>t.id))).ok)yield {msg:`${nm} ${pairs.length} çift daha koydu.`}
  }
  if(S.opened[s]==='sets'&&pairsOnTable()){const nw=h().filter(t=>!wild(t));let pairs=bestPairs(nw).pairs;while(pairs.length&&pairs.flat().length>=h().length)pairs.pop();
    if(pairs.length&&lay(s,pairs.map(g=>g.map(t=>t.id))).ok)yield {msg:`${nm} çiftlere ${pairs.length} çift işledi.`}}
  if(S.opened[s]){let cnt=0,any=true;
    while(any&&h().length>1){any=false;
      for(const t of h()){for(let i=0;i<S.table.length;i++)if(attach(s,t.id,i).ok){any=true;cnt++;break}if(any)break}}
    if(cnt)yield {msg:`${nm} ${cnt} taş işledi.`}}
  if(S.sideTile!=null&&S.opened[s]){const st=h().find(x=>x.id===S.sideTile);
    if(st){for(let i=0;i<S.table.length;i++)if(attach(s,st.id,i).ok)break;
      if(h().includes(st)){const cs=candidates(h()).filter(c=>c.tiles.includes(st)).sort((x,y)=>y.value-x.value);
        for(const c of cs)if(lay(s,[c.tiles.map(x=>x.id)]).ok)break;
        if(h().includes(st)&&pairsOnTable()){const m=h().find(u=>u!==st&&!wild(u)&&eff(u).c===eff(st).c&&eff(u).n===eff(st).n);if(m)lay(s,[[st.id,m.id]])}}}}
  const t=botPickDiscard(s),r=discard(s,t.id,true);
  let msg=`${nm} ${tname(t)} attı.`;
  if(r.pen.includes('işlek'))msg=`${nm} işlek taş attı, 101 ceza!`;
  if(r.pen.includes('okey'))msg=`${nm} okey attı, 101 ceza!`;
  if(r.pen.includes('yandan'))msg+=` Yandan aldığını kullanmadı, 101 ceza.`;
  if(r.finished)msg=`${nm} bitti!`;
  yield {msg,hit:!!r.finished,discard:true};
}

<script>
(()=>{
const $=id=>document.getElementById(id);
const reduce=false;
/* sekme arka plandayken tarayıcı zamanlayıcıları ve animasyonları durdurur; masa sahibinde botlar beklemesin diye o zaman beklemeden geçeriz */
const hid=()=>document.hidden;
const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0)});
const wait=ms=>hid()?tick():new Promise(r=>{let done=false;const f=()=>{if(!done){done=true;document.removeEventListener('visibilitychange',v);r()}},v=()=>{if(hid())f()};document.addEventListener('visibilitychange',v);setTimeout(f,reduce?Math.min(ms,200):ms)});
const COLS=15,ROWS=2,SW=56,SH=76,SX=59,X0=26,Y0=[10,90];
const AV=['S','N','R','H'],AVC=['var(--o0)','var(--o1)','var(--o2)','var(--o3)'];
const U={rising:true,rig:{all:false,ok:0,pair:false},help:true,sel:new Set(),slots:Array(COLS*ROWS).fill(null),newId:null,busy:false,logs:[]};

function syncSlots(){
  const ids=new Set(H().map(t=>t.id));
  U.slots=U.slots.map(id=>id!=null&&ids.has(id)?id:null);
  const placed=new Set(U.slots.filter(x=>x!=null));
  for(const t of H())if(!placed.has(t.id))placeNew(t.id);
}
function placeNew(id,pref){
  if(pref!=null&&U.slots[pref]==null){U.slots[pref]=id;return}
  let last=-1;U.slots.forEach((x,i)=>{if(x!=null)last=i});
  for(let i=last+1;i<U.slots.length;i++)if(U.slots[i]==null){U.slots[i]=id;return}
  const i=U.slots.indexOf(null);if(i>=0)U.slots[i]=id;
}
function rackGroups(){
  const out=[];
  for(let r=0;r<ROWS;r++){let cur=[];
    for(let c=0;c<=COLS;c++){const id=c<COLS?U.slots[r*COLS+c]:null;
      if(id!=null&&byId(id))cur.push(byId(id));else{if(cur.length)out.push(cur);cur=[]}}}
  return out;
}
function arrange(groups,rest){
  const slots=Array(COLS*ROWS).fill(null);let r=0,c=0;const left=[...rest];
  const put=g=>{if(c+g.length>COLS){r++;c=0}if(r>=ROWS)return false;g.forEach(t=>{slots[r*COLS+c++]=t.id});c++;if(c>=COLS){r++;c=0}return true};
  for(const g of groups)if(!put(g))left.push(...g);
  for(const t of left){let i=slots.indexOf(null,r*COLS+c);if(i<0)i=slots.indexOf(null);slots[i]=t.id}
  U.slots=slots;
}
function plainSort(ts){return ts.slice().sort((a,b)=>{const x=wild(a)?9:eff(a).c,y=wild(b)?9:eff(b).c;return x-y||eff(a).n-eff(b).n})}
function sortSeri(){

  const gs=b.sets.map(g=>{const v=validate(g),o=g.map((t,i)=>({t,r:v.reps[i]}));o.sort((x,y)=>v.type==='run'?x.r.n-y.r.n:x.r.c-y.r.c);return o.map(x=>x.t)});
  arrange(gs,plainSort(H().filter(t=>!b.used.has(t.id))));
}
function sortIslek(){
  const isl=H().filter(t=>!wild(t)&&canAttachAny(t));
  if(!isl.length){toast(S.table.some(x=>x.type!=='pair')?'Istakanda işlek taş yok.':'Masada henüz seri yok, işlek taş olmaz.');return false}
  const ids=new Set(isl.map(t=>t.id)),rest=H().filter(t=>!ids.has(t.id));
  const b=bestSets(rest,30);
  const gs=b.sets.map(g=>{const v=validate(g),o=g.map((t,i)=>({t,r:v.reps[i]}));o.sort((x,y)=>v.type==='run'?x.r.n-y.r.n:x.r.c-y.r.c);return o.map(x=>x.t)});
  arrange(gs,plainSort(rest.filter(t=>!b.used.has(t.id))));
  const end=COLS*ROWS,start=end-isl.length;
  if(start>0&&U.slots[start-1]!=null){} // ayraç için bir boşluk açmaya çalış
  const want=[...Array(isl.length)].map((_,k)=>start+k);
  for(const i of want){if(U.slots[i]!=null){const j=U.slots.findIndex((x,k)=>x==null&&k<start-1);const jj=j>=0?j:U.slots.findIndex((x,k)=>x==null&&k<start);U.slots[jj]=U.slots[i];U.slots[i]=null}}
  if(start-1>=COLS&&U.slots[start-1]!=null){const j=U.slots.findIndex((x,k)=>x==null&&k<start-1);if(j>=0){U.slots[j]=U.slots[start-1];U.slots[start-1]=null}}
  plainSort(isl).forEach((t,k)=>U.slots[start+k]=t.id);

}
function myAct(){return S.turn===0&&S.phase==='act'&&!S.ended&&!U.busy}
function dropPair(id){
  if(!myAct()){toast('Sıra sende olunca çift koyabilirsin.');render();return}
  const op=S.opened[0];
  if(op==='sets'&&!pairsOnTable()){toast('Masada çifte giden yok; seriyle açan çift koyamaz.');render();return}
  if(!op){ // açmadıysa: 5 çift varsa hepsini aç
    let pairs=bestPairs(H()).pairs;while(pairs.length&&pairs.flat().length>=H().length-1)pairs.pop();
    if(pairs.length<5){toast(`Çifte gitmek için 5 çift lazım, ıstakanda ${pairs.length} var.`);render();return}
    const tb=tableSig();const r=lay(0,pairs.map(g=>g.map(t=>t.id)));if(!res(r)){render();return}
    snd('open');banner('ÇİFTE GİTTİN','small');log(`${pairs.length} çiftle açtın!`,true);U.sel.clear();render();popNewSets(tb);return}
  const t=byId(id);if(!t)return;

function autoPairs(){

async function run(){

      const deck0=S.deck.length,side0=S.discards[prev(s)].slice(-1)[0],sideN=S.discards[prev(s)].length,disN=S.discards[s].length,tb=tableSig();
      let res0;try{res0=gen.next()}catch(err){console.error(err);const h=S.hands[s];if(!S.ended&&S.turn===s){if(S.phase==='draw')draw(s,'deck');if(!S.ended&&S.phase==='act')discard(s,h[h.length-1].id,true)}break}

      if(S.deck.length<deck0){await fly(null,$('deck'),pl,360,true)}
      if(st&&st.swap){const i=S.table.findIndex((t,k)=>k<wc.length&&t.tiles.filter(wild).length<wc[k]);const se=document.querySelector(`[data-set="${i}"]`);
        if(se){const okT={id:-1,c:S.okC,n:S.okN,fake:false};se.classList.add('glow');await fly(okT,se,pl,650)}}
      if(S.discards[prev(s)].length<sideN){const c=$('cr'+prev(s));c.innerHTML='';await fly(side0,c,pl,380)}
      if(S.discards[s].length>disN){const dt=S.discards[s][S.discards[s].length-1];if(S.ended&&S.result&&S.result.fin===s){await fly(null,pl,$('deck'),420,true);showFinish(dt)}else await fly(dt,pl,$('cr'+s),380)}
      if(st.msg&&!st.discard)log(st.msg,st.hit);if(st.discard&&(st.hit||/ceza/.test(st.msg)))log(st.msg,true);
      if(st.discard)snd(/ceza/.test(st.msg)?'bad':'drop');if(st.hit&&!st.discard)snd('open');if(st.hit&&/bitti/.test(st.msg))snd('win');
      render();popNewSets(tb);

        if(m)banner(`${NAMES[s]} ${m[1]} ile açtı`,'small');else if(mp)banner(`${NAMES[s]} çifte gitti`,'small');else if(/okeyi aldı/.test(st.msg))banner(`${NAMES[s]} okeyi aldı`,'small');else if(/bitti/.test(st.msg))banner(`${NAMES[s]} bitti!`)}
      if(/ceza/.test(st.msg))banner('101 CEZA','bad small');

  }
  U.busy=false;render();if(S.ended)return setTimeout(handEnd,S.result&&S.result.fin!=null?1700:700*U.speed);
  if(S.turn===0){banner('SIRA SENDE','small');snd('tap')}
}

function startOnline(){if(window.KQuick)KQuick.update({started:true});OK.quick=false;OK.started=true;OK.human=[0,1,2,3].map(i=>!!OK.lob.find(l=>l.seat===i));let b=0;
  OK.names=[0,1,2,3].map(i=>{const l=OK.lob.find(x=>x.seat===i);return l?l.name:ORIG_N[1+(b++)]});setNames(viewNames(0));
  const rig=U.rig;U.rig={all:false,ok:0,pair:false};close();startGame(menuN);GM.started=true;U.rig=rig;sendAll()}
function leaveOnline(){if(window.KQuick)KQuick.stop();if(!OK.on)return;OK.quick=false;clearInterval(OK.hb);try{OK.peer.destroy()}catch(e){}Object.assign(OK,{on:false,host:false,started:false,conns:{},lob:[],conn:null,gver:-1,endShown:-1});
  setNames(ORIG_N);NAMES[0]='Sen';window.KChat&&KChat.unmount();try{history.replaceState(null,'',location.pathname)}catch(e){}}
function quickPlay(){if(!myNameK()){open(`<h2>⚡ Hızlı oyun</h2><p class="muted">Adını yaz, sana masa bulalım.</p><input id="nmK" maxlength="14" placeholder="Adını yaz" style="width:100%;min-height:46px;border-radius:12px;border:1px solid #c9c1b0;padding:0 12px;font:600 16px/1 inherit">
    <div class="rowb"><button class="btn green" id="goK">Masa bul</button></div>`);$('goK').onclick=()=>{const v=$('nmK').value.trim().slice(0,14);if(!v)return;try{localStorage.setItem('okey101_name',v)}catch(e){}quickPlay()};return}
  leaveOnline();open('<h2>Masa aranıyor…</h2><p class="muted">Açık bir masa varsa oturtuyoruz, yoksa sana yeni masa açıyoruz.</p><div class="rowb"><button class="btn ghost" id="qcK">Vazgeç</button></div>');$('qcK').onclick=()=>{leaveOnline();showMenu()};
  KQuick.find(U.classic?'okey':'okey101',{onJoin:c=>joinOnline(c),onHost:()=>{hostOnline();OK.quick=true;OK.q2=0;KQuick.advertise(U.classic?'okey':'okey101',OK.code,{n:1,max:4});onlineMenu()}})}
window.KH_HOST=()=>{hostOnline();return linkK(OK.code)+''};
/* misafir */
function joinOnline(code){if(!myNameK()){open(`<h2>101 Okey masasına davet</h2><p class="muted">Adını yaz ve masaya otur.</p><input id="nmK" maxlength="14" placeholder="Adını yaz" style="width:100%;min-height:46px;border-radius:12px;border:1px solid #c9c1b0;padding:0 12px;font:600 16px/1 inherit">
    <div class="rowb"><button class="btn green" id="goK">Masaya otur</button></div>`);$('goK').onclick=()=>{try{localStorage.setItem('okey101_name',($('nmK').value.trim()||'Misafir').slice(0,14))}catch(e){}joinOnline(code)};return}
  Object.assign(OK,{on:true,host:false,code,peer:new Peer(),conn:null,started:false,gver:-1,last:0});
  for(const f in ENG)window[f]=function(s,...a){const r=ENG[f](s,...a);if(OK.on&&!OK.host&&s===0&&r&&r.ok)gsendK({t:'act',fn:f,a});return r};
  open('<h2>Bağlanılıyor…</h2><p class="muted">Masaya bağlanıyorsun, birkaç saniye sürebilir.</p>');
  const connect=()=>{if(!OK.on)return;try{OK.conn&&OK.conn.close()}catch(e){}const c=OK.peer.connect(PFXK+code);OK.conn=c;c.on('open',()=>c.send({t:'hello',uid:UIDK,name:myNameK()}));c.on('data',d=>{OK.last=Date.now();if(d&&d.t==='away')hostAway(true);else hostAway(false);guestRecvK(d)})};
  OK.peer.on('open',connect);
  OK.peer.on('error',e=>{if(e.type==='peer-unavailable'){open('<h2>Masa bulunamadı</h2><p class="muted">Ev sahibinin sayfası kapalı olabilir. Linki tekrar iste.</p><div class="rowb"><button class="btn green" id="mmK">Menü</button></div>');$('mmK').onclick=()=>{leaveOnline();showMenu()}}});
  KChat.mount({side:'left',send:m=>gsendK(m)});
  OK.hb=setInterval(()=>{if(!OK.on)return;gsendK({t:'ping'});if(OK.started&&OK.last&&Date.now()-OK.last>7000)hostAway(true);if(OK.last&&Date.now()-OK.last>9000){OK.last=Date.now();connect()}},3000)}
/* masayı kuranın sayfası arka plana geçtiyse ya da bağlantısı koptuysa misafirlere söyle (botlar onun cihazında oynar) */
function hostAway(on){let e=document.getElementById('hostAway');if(!on){if(e)e.hidden=true;return}
  if(!e){e=document.createElement('div');e.id='hostAway';e.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;background:rgba(20,12,6,.94);color:#fff;padding:10px 16px;border-radius:12px;font:600 14px/1.35 Rubik,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center;border:1px solid #e7b54c';e.textContent='Masayı kuran oyuncu uygulamadan çıktı ya da bağlantısı koptu. Bilgisayar oyuncuları onun cihazında oynar; geri dönünce oyun kaldığı yerden devam eder.';document.body.appendChild(e)}
  e.hidden=false}
document.addEventListener('visibilitychange',()=>{if(OK.on&&OK.host&&OK.started){if(document.hidden)bcastK({t:'away'});else{sendAll();if(typeof run==='function')run()}}});
function gsendK(d){if(OK.conn&&OK.conn.open)try{OK.conn.send({...d,uid:UIDK})}catch(e){}}
function guestRecvK(d){if(!d)return;
  if(d.t==='full'){open('<h2>Masa dolu</h2><p class="muted">Bu masada 4 kişi var.</p>');return}
  if(d.t==='lobby'){OK.lobNames=d.names;if(!OK.started)onlineMenu();return}
  if(d.t==='chat')return KChat.receive(d);if(d.t==='emo')return KChat.emoji(d);
  if(d.t==='st')gApply(d)}
function gApply(d){if(drag||U.busy){clearTimeout(gApply.t);gApply.t=setTimeout(()=>gApply(d),150);return}if(d.v<=OK.gver)return;OK.gver=d.v;
  const first=!OK.started,prevHand=GM&&GM.handNo,prevDisc=S&&!first?S.discards.map(x=>x.length):null,prevTurn=S&&S.turn;
  OK.started=true;RULES.rising=d.rising;RULES.classic=!!d.classic;setNames(d.names);S=d.S;GM=d.GM;GM.started=true;
  if(first||prevHand!==GM.handNo){U.sel.clear();U.slots=Array(COLS*ROWS).fill(null);U.newId=null;sortSeri();OK.endShown=-1;
    if(!$('ov').hidden)close();log(`${GM.handNo}. el · okey ${CN[S.okC]} ${S.okN}`,true);banner(`${GM.handNo}. EL`,'small')}
  else if(prevDisc)for(let s=1;s<4;s++)if(S.discards[s].length>prevDisc[s]){const t=S.discards[s][S.discards[s].length-1];snd('drop');log(`${NAMES[s]} ${tname(t)} attı`)}
  render();
  if(!S.ended&&S.turn===0&&prevTurn!==0&&!first){banner('SIRA SENDE','small');snd('tap')}
  if(S.ended&&GM.hist.length>=GM.handNo&&OK.endShown!==GM.handNo){OK.endShown=GM.handNo;setTimeout(guestEnd,600)}}
function guestEnd(){if(!S||!S.result||GM.hist.length<GM.handNo)return;const R=S.result,last=GM.handNo>=GM.total;
  let h=`<h2>${R.fin==null?'Orta bitti':R.fin===0?'Bitirdin!':escK(NAMES[R.fin])+' bitti'}</h2>
  <table class="res"><thead><tr><th>Oyuncu</th><th>Bu el</th><th>Ceza</th><th>Toplam</th></tr></thead><tbody>
  ${R.rows.map((r,s)=>`<tr><td>${escK(NAMES[s])}<small>${r.how}</small></td><td>${r.base}</td><td>${r.pen||'–'}</td><td class="${s===R.fin?'win':''}">${GM.totals[s]}</td></tr>`).join('')}</tbody></table>`;
  if(last&&GM.esli){const tA=GM.totals[0]+GM.totals[2],tB=GM.totals[1]+GM.totals[3];window.KH&&KH.stat('101 Okey',tA<tB);h+=`<h2>${tA<tB?'Ortağınla kazandınız!':tA===tB?'Berabere':'Rakipler kazandı'}</h2>${teamLine()}`}
  else if(last){const order=[0,1,2,3].sort((a,b)=>GM.totals[a]-GM.totals[b]);window.KH&&KH.stat('101 Okey',order[0]===0);h+=`<h2>${order[0]===0?'Masanın galibi sensin!':escK(NAMES[order[0]])+' kazandı'}</h2><p class="muted">${order.map((s,i)=>`${i+1}. ${escK(NAMES[s])} (${GM.totals[s]})`).join(' · ')}</p>`}
  h+=`<p class="muted">Ev sahibi ${last?'yeni oyunu':'sıradaki eli'} başlatınca devam edersiniz.</p>`;open(h)}

{const L=String(window.LANG||'tr').slice(0,2);if(L!=='tr')document.documentElement.style.setProperty('--isl',L==='ru'?'"ДОКЛАД"':'"PLAYABLE"');if(L!=='tr')document.documentElement.style.setProperty('--sirada',L==='ru'?'" · ХОДИТ"':'" · TO PLAY"')}
GM={total:5,handNo:1,totals:[0,0,0,0],hist:[],dealer:0};
dealHand(0);sortSeri();render();
{const hc=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{5}$/.test(hc))joinOnline(hc);else showMenu()}
{const q=new URLSearchParams(location.search);if(q.get('hizli')){try{q.delete('hizli');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}catch(e){}setTimeout(()=>{try{quickPlay()}catch(e){console.error(e)}},400)}}
})();
</script>
