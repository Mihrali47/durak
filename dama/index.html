<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dama</title>
<script src="i18n-page.js"></script><script src="../i18n.js"></script>
<script src="../mqtt.min.js"></script><script src="../relay.js"></script><script src="../chat.js"></script>
<script src="engine.js"></script><script src="../account.js"></script><script src="../quick.js"></script><script src="../ttimer.js"></script><script src="../sfx.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2b1b11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Ahşap dama tahtası. Senin taşların hep altta. Sırası gelenin kutusu yeşil yanıp söner. */
:root{--ink:#f4ead8;--muted:#bfa88c;--brass:#e7b54c;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
@supports (height:100svh){html,body{height:100svh}}
body{background:radial-gradient(ellipse at 50% 35%,#3a2617,#1c120c 75%);color:var(--ink);font:15px/1.35 var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:8px;min-height:40px}
header .t{flex:1;text-align:center;font-weight:700;font-size:16px}
.hb{background:rgba(0,0,0,.25);border:1px solid #4d3320;border-radius:10px;padding:7px 11px;font-size:13.5px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:11px;background:rgba(0,0,0,.25);border:2px solid transparent;font-size:14px}
.pl.turn{background:linear-gradient(180deg,rgba(47,157,92,.95),rgba(26,110,62,.95));border-color:#8ff0b3;animation:turnBlink 1s ease-in-out infinite}
.pl.turn .n::after{content:var(--sirada," · SIRADA");color:#fff4c2;font-size:.8em;font-weight:700}
@keyframes turnBlink{50%{filter:brightness(1.3);box-shadow:0 0 0 5px rgba(143,240,179,.5),0 0 24px rgba(143,240,179,.6)}}
.pl .c{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.pl .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pl .s{font-weight:700;font-size:17px;color:var(--brass);min-width:18px;text-align:right}
.pl.turn .s{color:#fff4c2}
.pl small{color:var(--muted);font-size:12px}.pl.turn small{color:#d9f7e4}
.wrapb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
svg.board{width:100%;height:100%;max-height:100%;display:block;touch-action:manipulation}
.pc{transition:transform .22s cubic-bezier(.3,.8,.3,1),opacity .25s}
.tg{animation:tg .9s ease-in-out infinite}
@keyframes tg{50%{opacity:.45}}
.msg{font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.msg b{color:var(--brass)}
/* paneller */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,7,4,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{background:#f7f3ea;color:#22201b;border-radius:16px;width:min(420px,100%);max-height:calc(100% - 10px);overflow:auto;padding:18px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet p{margin:6px 0;color:#4d483f;font-size:14px}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:11px;padding:12px 10px;background:#e7e0d1;color:#22201b;font-weight:500;font-size:15px;text-align:center;text-decoration:none}
.btn.pri{background:#2f6b4f;color:#fff}.btn:disabled{opacity:.45}
.seg{display:flex;background:#e7e0d1;border-radius:11px;padding:3px;margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:14px;color:#3b372f}
.seg button.on{background:#fff;color:#16130e;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7a7365;margin-top:14px;font-weight:600}
.rank{list-style:none;padding:0;margin:10px 0 0}
.rank li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;background:#efe9dc;margin-bottom:5px;font-size:15px}
.lnk{display:flex;gap:6px;margin-top:8px}
.lnk input{flex:1;min-width:0;border:1px solid #d9d1bf;border-radius:10px;padding:10px;font-size:13px;background:#fff;color:#222}
.lnk button{border:0;border-radius:10px;background:#2f6b4f;color:#fff;padding:0 14px}
input.name{width:100%;border:1px solid #d9d1bf;border-radius:10px;padding:11px;font-size:15px;margin-top:6px;background:#fff;color:#222}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:60;background:rgba(20,12,6,.92);color:#fff;padding:9px 15px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .3s;max-width:90vw;text-align:center}
@media (orientation:landscape) and (max-height:560px){
  .app{display:grid;grid-template-columns:1fr minmax(170px,32vw);grid-template-rows:auto 1fr auto auto 1fr;column-gap:10px;max-width:none}
  header{grid-column:1/3}
  .wrapb{grid-column:1;grid-row:2/6}
  #pO{grid-column:2;grid-row:2;align-self:end}
  #pM{grid-column:2;grid-row:3}
  .msg{grid-column:2;grid-row:4}
}
</style>
</head>
<body>
<div class="app">
  <header><button class="hb" id="bMenu">Menü</button><div class="t" id="ttl">Dama</div><button class="hb" id="bRules">Kurallar</button></header>
  <div class="pl" id="pO"></div>
  <div class="wrapb"><svg class="board" id="svg" viewBox="0 0 680 680" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="pl" id="pM"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const D=window.DAMA,$=id=>document.getElementById(id);
const ST={get(k,d){try{const v=localStorage.getItem('dm_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dm_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('dm_'+k)}catch(e){}}};
const UID=ST.get('uid',null)||(()=>{const u=Math.random().toString(36).slice(2,10);ST.set('uid',u);return u})();
const SPD=+(new URLSearchParams(location.search).get('spd')||1);
let botLvl=ST.get('lvl','normal'),variant=ST.get('v','tr'),target=ST.get('target',3);
{const q=new URLSearchParams(location.search).get('v');if(q==='ru'||q==='tr')variant=q}
let G=null,me='w',mode='off',names=['Sen','Nuri'],ver=0,busy=false,sel=null,botT=null,schedKey=null,view0=null,shownMid=0;
const ci=c=>c==='w'?0:1,op=c=>c==='w'?'b':'w';
const myName=()=>(window.KH&&KH.name())||ST.get('name','')||'Sen';
const pn=c=>c===me&&mode==='off'?'Sen':names[ci(c)];
const VN=v=>v==='ru'?'Rus daması':'Türk daması';
function toast(h,ms=2200){const t=$('toast');t.innerHTML=h;t.hidden=false;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},ms)}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- tahta ---------- */
const SQ=80,OFF=20;
const disp=i=>{const r=i>>3,c=i&7;return me==='w'?[r,c]:[7-r,7-c]};
const cx=i=>OFF+disp(i)[1]*SQ+SQ/2,cy=i=>OFF+disp(i)[0]*SQ+SQ/2;
function svgEl(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e}
function drawBase(){const s=$('svg');s.innerHTML='';const ru=G&&G.v==='ru';
  s.appendChild(svgEl('rect',{x:0,y:0,width:680,height:680,rx:16,fill:'#5a3a22'}));
  for(let i=0;i<64;i++){const [r,c]=[i>>3,i&7],dark=(r+c)%2===1;
    s.appendChild(svgEl('rect',{x:OFF+c*SQ,y:OFF+r*SQ,width:SQ,height:SQ,fill:ru?(dark?'#7a4a2a':'#ecd9b4'):(dark?'#d9b98a':'#e8d1a4')}))}
  if(!ru)for(let k=0;k<=8;k++){s.appendChild(svgEl('line',{x1:OFF+k*SQ,y1:OFF,x2:OFF+k*SQ,y2:OFF+640,stroke:'#8a6440','stroke-width':1.5}));s.appendChild(svgEl('line',{x1:OFF,y1:OFF+k*SQ,x2:OFF+640,y2:OFF+k*SQ,stroke:'#8a6440','stroke-width':1.5}))}
  s.appendChild(svgEl('rect',{x:OFF,y:OFF,width:640,height:640,fill:'none',stroke:'#3b2414','stroke-width':4}));
  s.appendChild(svgEl('g',{id:'gLast'}));s.appendChild(svgEl('g',{id:'gHi'}));s.appendChild(svgEl('g',{id:'gPc'}));s.appendChild(svgEl('g',{id:'gTg'}));
  for(let i=0;i<64;i++){const [r,c]=disp(i);s.appendChild(svgEl('rect',{x:OFF+c*SQ,y:OFF+r*SQ,width:SQ,height:SQ,fill:'transparent','data-i':i}))}}
function piece(i,p){const g=svgEl('g',{class:'pc',transform:`translate(${cx(i)},${cy(i)})`,'data-at':i});const w=p.c==='w';
  g.appendChild(svgEl('circle',{r:31,cy:4,fill:'rgba(0,0,0,.35)'}));
  g.appendChild(svgEl('circle',{r:31,fill:w?'#f4ead8':'#2a211b',stroke:w?'#b9a27c':'#000','stroke-width':2}));
  g.appendChild(svgEl('circle',{r:22,fill:'none',stroke:w?'#d8c49d':'#4a3d33','stroke-width':2}));
  if(p.k){const t=svgEl('text',{y:11,'text-anchor':'middle','font-size':32,fill:w?'#b8862b':'#e7b54c','font-family':'serif'});t.textContent='♛';g.appendChild(t)}
  return g}
function drawPieces(b){const g=$('gPc');g.innerHTML='';for(let i=0;i<64;i++)if(b[i])g.appendChild(piece(i,b[i]))}
function drawMarks(){const L=$('gLast'),H=$('gHi'),T=$('gTg');L.innerHTML=H.innerHTML=T.innerHTML='';
  const sq=(i,f,cls)=>{const [r,c]=disp(i);const e=svgEl('rect',{x:OFF+c*SQ,y:OFF+r*SQ,width:SQ,height:SQ,fill:f});if(cls)e.setAttribute('class',cls);return e};
  if(G.last&&!busy)for(const i of [G.last.from,G.last.path[G.last.path.length-1]])L.appendChild(sq(i,'rgba(231,181,76,.28)'));
  if(!myTurn())return;const Lg=D.legal(G);
  const from=[...new Set(Lg.map(m=>m.from))];
  if(sel==null&&Lg[0]&&Lg[0].caps.length)for(const i of from)H.appendChild(sq(i,'rgba(214,69,65,.35)','tg'));
  if(sel!=null){H.appendChild(sq(sel,'rgba(143,240,179,.5)'));
    for(const m of Lg.filter(m=>m.from===sel)){const to=m.path[m.path.length-1];T.appendChild(svgEl('circle',{cx:cx(to),cy:cy(to),r:16,fill:'rgba(47,157,92,.85)',class:'tg'}))}}}
/* ---------- akış ---------- */
const myTurn=()=>G&&G.phase==='play'&&!busy&&G.turn===me&&(mode!=='off'||true);
const isBot=c=>mode==='off'?c!==me:mode==='host'?(c!==me&&away()):false;
function cnt(c){return G.b.filter(x=>x&&x.c===c).length}
function render(){if(!G)return;if(render.key!==me+G.v){drawBase();render.key=me+G.v}
  if(!busy)drawPieces(G.b);drawMarks();
  $('ttl').textContent=VN(G.v);
  const pl=(c,id)=>{const on=G.turn===c&&G.phase==='play';$(id).className='pl'+(on?' turn':'');
    $(id).innerHTML=`<span class="c" style="background:${c==='w'?'#f4ead8':'#2a211b'};border:2px solid ${c==='w'?'#b9a27c':'#000'}"></span><span class="n">${esc(pn(c))}</span><small>${cnt(c)} taş</small><span class="s">${G.score[c]}</span>`};
  pl(op(me),'pO');pl(me,'pM');$('pM').style.paddingRight=mode==='off'?'':'60px';
  let m='';
  if(G.phase!=='play')m='';
  else if(G.turn===me){const L=D.legal(G);m=L[0]&&L[0].caps.length?(G.v==='tr'?'Almak zorunlu: en çok taş alan hamleyi oyna':'Almak zorunlu'):sel==null?'Oynatacağın taşa dokun':'Gideceği yere dokun'}
  else m=`${pn(G.turn)} düşünüyor…`;
  $('msg').textContent=m}
$('svg').addEventListener('click',e=>{const h=e.target.closest('[data-i]');if(!h||!myTurn())return;const i=+h.dataset.i;const L=D.legal(G);
  if(sel!=null){const c=L.filter(m=>m.from===sel&&m.path[m.path.length-1]===i);if(c.length){c.sort((a,b)=>b.caps.length-a.caps.length);doMove(c[0]);return}}
  if(L.some(m=>m.from===i)){sel=sel===i?null:i;KSfx.play('tap');const ms=L.filter(m=>m.from===i);
    if(ms.length===1&&ms[0].caps.length){doMove(ms[0]);return}render();return}
  if(G.b[i]&&G.b[i].c===me&&L.length&&L[0].caps.length)toast(G.v==='tr'?'Almak zorunlu, kırmızı taşlarla oyna':'Almak zorunlu');
  sel=null;render()});
function doMove(m){sel=null;act(me,{k:'move',from:m.from,path:m.path})}
function act(c,a){if(mode==='guest'){send({t:'act',uid:UID,a});return}
  let e=null;if(a.k==='move')e=D.play(G,c,{from:a.from,path:a.path});else if(a.k==='next'){if(G.phase!=='gameOver')return;D.next(G)}
  if(e){if(c===me)toast(e);return}ver++;bcastState();sync()}
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPD));
async function animate(L){const g=$('gPc');const el=g.querySelector(`[data-at="${L.from}"]`);if(!el)return;g.appendChild(el);
  for(let k=1;k<L.path.length;k++){const to=L.path[k];el.setAttribute('transform',`translate(${cx(to)},${cy(to)})`);KSfx.play(L.caps.length?'hit':'card');await wait(250);
    const cp=L.caps[k-1];if(cp!=null){const x=g.querySelector(`[data-at="${cp}"]`);if(x)x.style.opacity=0}}
  await wait(120)}
async function sync(){if(!G)return;if(busy)return sync.again=true;
  if(!G.last||G.mid<shownMid){shownMid=G.last?G.last.mid:0;if(!G.last)view0=null}
  if(G.last&&G.last.mid!==shownMid){const L=G.last;shownMid=L.mid;
    if(view0&&view0[L.from]&&view0[L.from].c===L.c){busy=true;drawPieces(view0);drawMarks();await animate(L);busy=false}}
  view0=G.b.slice();render();
  if(sync.again){sync.again=false;return sync()}after()}
function after(){if(!G)return;
  if(G.phase==='gameOver'||G.phase==='over'){showEnd();return}
  if(mode==='off')ST.set('save',{G,names});
  schedule()}
function schedule(){if(!G||busy||mode==='guest'||G.phase!=='play'){clearTimeout(botT);schedKey=null;return}
  const key=[ver,G.turn,G.mid,G.games].join();if(key===schedKey)return;schedKey=key;clearTimeout(botT);if(!isBot(G.turn))return;
  botT=setTimeout(()=>{schedKey=null;if(busy||!isBot(G.turn)||G.phase!=='play')return;act(G.turn,{k:'move',...pick()})},650/SPD)}
function pick(){const L=D.legal(G);if(mode==='off'&&botLvl==='kolay'&&Math.random()<.45){const c=L.filter(m=>m.caps.length===L[0].caps.length);const m=c[Math.random()*c.length|0];return {from:m.from,path:m.path}}
  const m=D.botMove(G,mode!=='off'?4:botLvl==='zor'?6:botLvl==='kolay'?2:4);return {from:m.from,path:m.path}}
function newMatch(){if(mode==='off'){me='w';names=[myName(),'Nuri']}G=D.newGame({v:variant,target});sel=null;view0=null;shownMid=0;showEnd.k=null;ver++;bcastState();hideOv();sync()}
/* ---------- paneller ---------- */
function ov(k,h){const s=$('sheet');s.dataset.k=k;s.innerHTML=h;$('ov').hidden=false;return s}
function hideOv(){$('ov').hidden=true;$('sheet').dataset.k=''}
function showEnd(){const k=G.phase+G.games;if(showEnd.k===k&&!$('ov').hidden)return;const first=showEnd.k!==k;showEnd.k=k;const w=G.winner,over=G.phase==='over';
  if(first)KSfx.play(w===me?'win':w?'lose':'turn');
  if(over&&first){const r=ST.get('rec',[0,0]);r[w===me?0:1]++;window.KH&&KH.stat('Dama',w===me);ST.set('rec',r);ST.del('save')}
  const h=!w?'Berabere':over?(w===me?'Maçı kazandın!':`${esc(pn(w))} maçı kazandı`):(w===me?'Oyunu kazandın!':`${esc(pn(w))} oyunu kazandı`);
  ov('end',`<h2>${h}</h2><p>${!w?'50 hamledir taş alınmadı.':''} <span>Maç ${G.target} galibiyete</span></p>
    <ul class="rank">${[me,op(me)].map(c=>`<li><b>${esc(pn(c))}</b><b>${G.score[c]}</b></li>`).join('')}</ul>
    <div class="row">${mode==='guest'?'<p>Ev sahibi devam ettirecek.</p>':over?'<button class="btn" id="eM">Menü</button><button class="btn pri" id="eN">Yeni maç</button>':'<button class="btn pri" id="eN">Sonraki oyun</button>'}</div>`);
  if(mode!=='guest'){$('eN').onclick=()=>{hideOv();if(over)newMatch();else act(me,{k:'next'})};if($('eM'))$('eM').onclick=showMenu}}
function rulesHtml(v){return v==='ru'?`<h2>Rus daması nasıl oynanır?</h2>
  <p>Oyun sadece koyu karelerde oynanır. Herkesin 12 taşı var. Taşlar çapraz olarak bir kare ileri gider.</p>
  <p>Rakip taşın hemen arkasındaki kare boşsa üstünden atlayıp alırsın. Taş alırken geriye doğru da alabilir. Alabildiğin taş varsa almak zorunlu; arka arkaya alabiliyorsan devam edersin.</p>
  <p>Karşı uca ulaşan taş dama olur: çaprazda istediği kadar gider, uzaktan alır. Taş alırken uca varırsa hemen dama olur ve dama olarak almaya devam eder.</p>
  <p>Rakibin taşlarını bitiren ya da onu hamle yapamaz hale getiren kazanır.</p>
  <p>Aynı konum üç kez tekrarlanırsa ya da 15'er hamle boyunca sadece damalar oynayıp hiç taş alınmazsa oyun berabere biter.</p>`:`<h2>Türk daması nasıl oynanır?</h2>
  <p>Herkesin 16 taşı var, ikinci ve üçüncü sıraya dizilir. Taşlar bir kare ileri ya da yana gider, geri gitmez. Çapraz hareket yoktur.</p>
  <p>Rakip taşın hemen arkasındaki kare boşsa üstünden atlayıp alırsın (ileri ya da yana). Almak zorunludur ve en çok taşı alan hamle oynanmalıdır. Alınan taş hemen kalkar.</p>
  <p>Karşı uca ulaşan taş dama olur: düz çizgide istediği kadar ileri, geri ve yana gider, uzaktaki taşı da alır.</p>
  <p>Rakibin taşlarını bitiren ya da onu hamle yapamaz hale getiren kazanır.</p>
  <p>Aynı konum üç kez tekrarlanırsa ya da 25'er hamle boyunca sadece damalar oynayıp hiç taş alınmazsa oyun berabere biter.</p>`}
function showRules(){ov('rules',rulesHtml(G?G.v:variant)+`<p>Taşına dokun, yeşil işaretli kareye dokun. Kırmızı yanıp sönen taşlar almak zorunda olanlar.</p><div class="row"><button class="btn pri" id="rOk">Tamam</button></div>`);
  $('rOk').onclick=()=>G&&G.phase!=='over'?(hideOv(),after()):showMenu()}
function showMenu(){const sv=ST.get('save',null),rec=ST.get('rec',[0,0]);
  const s=ov('menu',`<h2>Dama</h2><p>Taşlarını ilerlet, rakibin taşlarını al, dama ol. Bilgisayara karşı ya da linkle arkadaşınla.</p>
    <p class="lbl">Oyun</p><div class="seg" id="mV">${[["tr","Türk daması"],["ru","Rus daması"]].map(([k,v])=>`<button data-v="${k}" class="${variant===k?'on':''}">${v}</button>`).join('')}</div>
    <p class="lbl">Bilgisayar</p><div class="seg" id="mL">${[["kolay","Kolay"],["normal","Normal"],["zor","Zor"]].map(([k,v])=>`<button data-l="${k}" class="${botLvl===k?'on':''}">${v}</button>`).join('')}</div>
    <p class="lbl">Maç kaç galibiyete?</p><div class="seg" id="mT">${[1,3,5].map(n=>`<button data-n="${n}" class="${target===n?'on':''}">${n} oyun</button>`).join('')}</div>
    <div class="row" style="flex-direction:column">
      ${G&&G.phase!=='over'&&mode!=='guest'&&(G.games+G.mid)>0?'<button class="btn pri" id="mBack">Oyuna dön</button>':''}
      ${(!G||(!G.mid&&!G.games))&&sv?'<button class="btn pri" id="mLoad">Kaldığın yerden devam et</button>':''}
      <button class="btn" id="mBot">Bilgisayara karşı yeni maç</button>
      <button class="btn pri" id="mQuick">⚡ Hızlı oyun</button>
      <button class="btn" id="mOn">Arkadaşınla online</button>
      <button class="btn" id="mRules">Kurallar</button>
      <button class="btn" id="mSnd">${KSfx.on?'Ses: Açık':'Ses: Kapalı'}</button>
      <a class="btn" href="../">Salona dön</a></div>
    <p style="font-size:12.5px;margin-top:10px">Rekorun: ${rec[0]} galibiyet, ${rec[1]} mağlubiyet.</p>`);
  const seg=(id,k,f)=>s.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{f(b.dataset[k]);s.querySelectorAll(id+' button').forEach(x=>x.classList.toggle('on',x===b))});
  seg('#mV','v',v=>{variant=v;ST.set('v',v)});seg('#mL','l',v=>{botLvl=v;ST.set('lvl',v)});seg('#mT','n',v=>{target=+v;ST.set('target',target)});
  if($('mBack'))$('mBack').onclick=()=>{hideOv();after()};
  if($('mLoad'))$('mLoad').onclick=()=>{mode='off';me='w';G=sv.G;names=sv.names;names[0]=myName();sel=null;view0=null;shownMid=G.last?G.last.mid:0;hideOv();sync()};
  $('mBot').onclick=()=>{if(mode!=='off')leaveOnline();mode='off';newMatch()};$('mQuick').onclick=quickPlay;$('mOn').onclick=showOnline;$('mSnd').onclick=e=>{e.target.textContent=KSfx.toggle()?'Ses: Açık':'Ses: Kapalı'};$('mRules').onclick=showRules}
$('bMenu').onclick=showMenu;$('bRules').onclick=showRules;
$('ov').addEventListener('click',e=>{if(e.target===$('ov')&&$('sheet').dataset.k==='rules'&&G){hideOv();after()}});
/* ---------- online (2 kişi): ev sahibi beyaz ---------- */
const PFX='kdm-';let peer=null,conn=null,guest=null,lastSeen=0,room=null,started=false,lastRx=0,hb=null,gver=-1;
function away(){return !guest||Date.now()-lastSeen>25000}
function send(d){if(conn&&conn.open)try{conn.send(d)}catch(e){}}
function bcastState(){if(mode==='host'&&started)ST.set('host',{room,G,names,guest,ver,t:Date.now()});if(mode==='host'&&started&&conn)send({t:'state',ver,G,names,tl:KTimer.left()})}
function linkFor(c){return (location.protocol.startsWith('http')?location.origin+location.pathname:'https://mihrali47.github.io/durak/dama/')+'#'+c}
function showOnline(){ov('online',`<h2>Arkadaşınla online</h2><p>Masa kur, linki gönder. Arkadaşın girdiği an oyun başlar.</p>
  <p class="lbl">Adın</p><input class="name" id="oName" maxlength="14" value="${myName()==='Sen'?'':esc(myName())}" placeholder="Adını yaz">
  <div class="row"><button class="btn" id="oBack">Geri</button><button class="btn pri" id="oHost">Masa kur</button></div>`);
  $('oBack').onclick=showMenu;$('oHost').onclick=()=>{ST.set('name',$('oName').value.trim().slice(0,14));hostRoom()}}
function hostRoom(){leaveOnline();mode='host';started=false;guest=null;room=hostRoom.rs?hostRoom.rs.room:Math.random().toString(36).slice(2,7).toUpperCase();
  peer=new Peer(PFX+room);showLobby();peer.on('open',()=>{history.replaceState(null,'','#'+room)});
  peer.on('connection',c=>c.on('data',d=>hostRecv(c,d)));
  peer.on('error',e=>{if(e.type==='network')toast('Sunucuya bağlanılamadı, tekrar deneniyor…')});
  KChat.mount({send:m=>send({...m,name:myName()})});
  clearInterval(hb);hb=setInterval(()=>{if(mode!=='host')return;if(started){bcastState();schedule()}else quickTick()},3000)}
function hostRecv(c,d){if(!d||!d.uid)return;
  if(d.t==='hello'){if(guest&&guest!==d.uid){c.send({t:'full'});return}guest=d.uid;conn=c;lastSeen=Date.now();names=[myName(),String(d.name||'Misafir').slice(0,14)];
    if(!started){started=true;me='w';if(window.KQuick)KQuick.update({n:2,started:true});quick=false;newMatch()}else{ver++;bcastState()}return}
  if(d.uid!==guest)return;lastSeen=Date.now();
  if(d.t==='act'&&d.a)act('b',d.a);else if(d.t==='chat')KChat.receive({name:names[1],x:d.x,l:d.l});else if(d.t==='emo')KChat.emoji({name:names[1],e:d.e})}
/* sayfa arka planda kapanıp yeniden açılırsa ev sahibi masasını kaldığı yerden sürdürür */
function resumeHost(sv){hostRoom.rs=sv;hostRoom();hostRoom.rs=null;guest=sv.guest;lastSeen=Date.now();started=true;G=sv.G;names=sv.names;ver=(sv.ver||0)+1;me='w';sel=null;view0=null;shownMid=G.last?G.last.mid:0;hideOv();sync()}
function showLobby(){if(mode==='host'&&started)return;const link=linkFor(room);const s=ov('lobby',`<h2>Masa hazır</h2><p>Bu linki arkadaşına gönder. Girdiği an oyun başlar.</p><div class="lnk"><input id="lk" readonly value="${link}"><button id="lkC">Kopyala</button></div>
    ${window.KH?'<div class="row"><button class="btn" id="lkF">👥 Arkadaşlarını çağır</button></div>':''}
    <p class="lbl">Oyun</p><div class="seg" id="lV">${[["tr","Türk daması"],["ru","Rus daması"]].map(([k,v])=>`<button data-v="${k}" class="${variant===k?'on':''}">${v}</button>`).join('')}</div>
    <p class="lbl">Maç kaç galibiyete?</p><div class="seg" id="lT">${[1,3,5].map(n=>`<button data-n="${n}" class="${target===n?'on':''}">${n} oyun</button>`).join('')}</div>
    ${quick?'<p><b>Rakip aranıyor…</b> Biri gelince oyun hemen başlar. Linki arkadaşına da gönderebilirsin.</p>':'<p>Arkadaşın bekleniyor… Bu sayfayı kapatma.</p>'}<div class="row"><button class="btn" id="lBack">Vazgeç</button></div>`);
  s.querySelectorAll('#lT button').forEach(b=>b.onclick=()=>{target=+b.dataset.n;ST.set('target',target);s.querySelectorAll('#lT button').forEach(x=>x.classList.toggle('on',x===b))});
  s.querySelectorAll('#lV button').forEach(b=>{b.disabled=quick;b.onclick=()=>{variant=b.dataset.v;ST.set('v',variant);s.querySelectorAll('#lV button').forEach(x=>x.classList.toggle('on',x===b))}});
  if($('lkF'))$('lkF').onclick=()=>KH.invitePicker('Dama',link);
  $('lkC').onclick=async()=>{try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({title:'Dama',url:link});return}await navigator.clipboard.writeText(link);toast('Link kopyalandı')}catch(e){toast('Linki seçip kopyala')}};
  $('lBack').onclick=()=>{leaveOnline();mode='off';G=null;showMenu()}}
function joinRoom(code){leaveOnline();mode='guest';room=code;started=false;G=null;
  if(myName()==='Sen'){ov('join',`<h2>Dama masasına davet</h2><p>Adını yaz ve masaya otur.</p><input class="name" id="jName" maxlength="14" placeholder="Adını yaz"><div class="row"><button class="btn pri" id="jGo">Masaya otur</button></div>`);
    $('jGo').onclick=()=>{ST.set('name',($('jName').value.trim()||'Misafir').slice(0,14));joinRoom(code)};return}
  ov('lobby','<h2>Bağlanılıyor…</h2><p>Masaya bağlanıyorsun, birkaç saniye sürebilir.</p>');
  peer=new Peer();peer.on('open',connectHost);
  peer.on('error',e=>{if(e.type==='peer-unavailable'){ov('lobby','<h2>Masa bulunamadı</h2><p>Arkadaşının sayfası kapalı olabilir. Linki tekrar iste.</p><div class="row"><button class="btn pri" id="nf">Menüye dön</button></div>');$('nf').onclick=()=>{leaveOnline();mode='off';showMenu()}}});
  KChat.mount({send:m=>send({...m,uid:UID})});
  clearInterval(hb);hb=setInterval(()=>{if(mode!=='guest')return;send({t:'ping',uid:UID});if(lastRx&&Date.now()-lastRx>9000){lastRx=Date.now();connectHost()}},3000)}
function connectHost(){if(!peer)return;try{conn&&conn.close()}catch(e){}conn=peer.connect(PFX+room);conn.on('open',()=>conn.send({t:'hello',uid:UID,name:myName()}));conn.on('data',guestRecv)}
function guestRecv(d){lastRx=Date.now();if(!d)return;
  if(d.t==='full'){ov('lobby','<h2>Masa dolu</h2><p>Bu masada başka biri oynuyor.</p>');return}
  if(d.t==='chat')return KChat.receive({name:names[0],x:d.x,l:d.l});if(d.t==='emo')return KChat.emoji({name:names[0],e:d.e});
  if(d.t==='state'){if(d.ver<=gver)return;gver=d.ver;
    if(G&&d.G.games===0&&d.G.mid===0&&(G.mid>0||G.games>0))showEnd.k=null;
    me='b';started=true;names=d.names;G=d.G;sel=null;KTimer.remote(tkey(),d.tl);
    if(['lobby','join','end'].includes($('sheet').dataset.k)&&G.phase==='play')hideOv();sync()}}
function leaveOnline(){if(window.KQuick)KQuick.stop();quick=false;clearInterval(hb);try{peer&&peer.destroy()}catch(e){}peer=null;conn=null;guest=null;started=false;gver=-1;window.KChat&&KChat.unmount();try{history.replaceState(null,'',location.pathname)}catch(e){}}
/* ---------- hızlı oyun ---------- */
let quick=false;const qkey=()=>variant==='ru'?'damaru':'dama';
function quickPlay(){if(myName()==='Sen'){ov('qname',`<h2>⚡ Hızlı oyun</h2><p>Adını yaz, sana masa bulalım.</p><input class="name" id="qN" maxlength="14" placeholder="Adını yaz"><div class="row"><button class="btn" id="qB">Geri</button><button class="btn pri" id="qG">Masa bul</button></div>`);
    $('qB').onclick=showMenu;$('qG').onclick=()=>{const v=$('qN').value.trim().slice(0,14);if(!v)return;ST.set('name',v);quickPlay()};return}
  if(mode!=='off')leaveOnline();
  ov('lobby',`<h2>Masa aranıyor…</h2><p>${VN(variant)}: açık bir masa varsa oturtuyoruz, yoksa sana yeni masa açıyoruz.</p><div class="row"><button class="btn" id="qC">Vazgeç</button></div>`);$('qC').onclick=()=>{leaveOnline();mode='off';showMenu()};
  KQuick.find(qkey(),{onJoin:c=>joinRoom(c),onHost:()=>{hostRoom();quick=true;KQuick.advertise(qkey(),room,{n:1,max:2});showLobby()}})}
function quickTick(){if(!quick||mode!=='host'||started)return;KQuick.update({n:guest?2:1});
  if(!guest){const r=KQuick.rival(qkey(),room);if(r){leaveOnline();joinRoom(r)}}}
/* online hamle süresi */
const tkey=()=>G&&G.phase==='play'?[G.turn,G.mid,G.games].join(':'):null;
KTimer.init({secs:()=>40,key:tkey,actor:()=>G.turn,isHuman:c=>true,name:c=>c===me?'Sen':pn(c),mode:()=>started&&!busy?mode:'off',
  onExpire:c=>{toast(`<b>${esc(c===me?'Sen':pn(c))}</b>: <span>süre doldu</span>`);sel=null;if(G.phase==='play'&&mode!=='guest')act(c,{k:'move',...pick()})}});
window.KH_HOST=()=>{mode='off';hostRoom();return linkFor(room)};
const hc=(location.hash||'').slice(1).toUpperCase();
if(/^[A-Z0-9]{5}$/.test(hc)){const sv=ST.get('host',null);if(sv&&sv.room===hc&&Date.now()-sv.t<36e5)resumeHost(sv);else joinRoom(hc)}else showMenu();
{const q=new URLSearchParams(location.search);if(q.get('hizli')){try{q.delete('hizli');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}catch(e){}setTimeout(()=>{try{quickPlay()}catch(e){console.error(e)}},400)}}
addEventListener('load',()=>window.KH&&KH.setPresence('Dama'));
{const L=String(window.LANG||'tr').slice(0,2);if(L!=='tr')document.documentElement.style.setProperty('--sirada',L==='ru'?'" · ХОДИТ"':'" · TO PLAY"')}
</script>
</body></html>
