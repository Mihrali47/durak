<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batak</title>
<script src="i18n-page.js"></script><script src="../i18n.js"></script>
<script src="../mqtt.min.js"></script><script src="../relay.js"></script>
<script src="engine.js"></script><script src="../account.js"></script><script src="../quick.js"></script><script src="../ttimer.js"></script><script src="../sfx.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f3b2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Yeşil çuha masa, yukarıdan. Sen altta, rakipler sol-üst-sağ. Ortada el (trick), altta yelpaze el. Tek tema. */
:root{--room:#13261e;--felt:#2f5a47;--felt2:#264c3c;--line:rgba(255,255,255,.14);--card:#fff;--edge:#d6dbe0;--red:#c8323a;--black:#1a1d22;
  --back:#7a3b47;--backl:#9a5662;--ink:#f1f5f2;--muted:#c3d4cb;--gold:#e8c86a;--bad:#f0a196;--good:#9fe0b0;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--suit:"DejaVu Sans","Segoe UI Symbol","Apple Symbols",serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
@supports (height:100svh){html,body{height:100svh}}
body{background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt2) 65%,var(--room) 100%);color:var(--ink);font:15px/1.35 var(--body);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{position:relative;height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  --cw:min(17vw,9.6vh,84px);--ch:calc(var(--cw)*1.42);--tw:min(16vw,9vh,78px)}
header{display:flex;align-items:center;gap:8px;min-height:40px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{color:var(--muted);font-size:12.5px}
.hb{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px}
.trump{display:inline-flex;align-items:center;gap:4px}
.trump i{font-style:normal;font-family:var(--suit);font-size:17px;background:#fff;border-radius:6px;padding:0 5px;line-height:22px}
/* masa */
.table{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px;padding:4px}
.seat.top{grid-column:1/4;grid-row:1}
.seat.left{grid-column:1;grid-row:2;align-self:center}
.seat.right{grid-column:3;grid-row:2;align-self:center}
.av{position:relative;width:46px;height:46px;border-radius:50%;background:#e9dcc4;color:#3b2a1a;display:grid;place-items:center;font-weight:700;font-size:19px;
  border:3px solid rgba(255,255,255,.25);transition:border-color .2s,box-shadow .2s}
.seat.turn .av,.me.turn .av{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,200,106,.25)}
.av .cz{position:absolute;right:-6px;bottom:-4px;background:var(--gold);color:#2b2010;border-radius:8px;font-size:10.5px;padding:1px 4px;font-weight:700}
.nm{font-size:13px;font-weight:500;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--muted);display:flex;gap:7px}
.st .pt{color:var(--ink);font-weight:700}
.st .pt.neg{color:var(--bad)}.st .pt.pos{color:var(--good)}
.backs{display:flex;height:22px}
.backs span{width:14px;height:21px;margin-left:-8px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--back) 0 4px,var(--backl) 4px 6px);border:1px solid rgba(255,255,255,.5)}
.backs span:first-child{margin-left:0}
.mid{grid-column:2;grid-row:2;position:relative;min-height:calc(var(--tw)*2.9)}
.slot{position:absolute;left:50%;top:50%;width:var(--tw);height:calc(var(--tw)*1.42);margin:calc(var(--tw)*-.71) 0 0 calc(var(--tw)*-.5);transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .45s}
.slot.v0{transform:translate(0,52%)}.slot.v1{transform:translate(-62%,0) rotate(-6deg)}.slot.v2{transform:translate(0,-52%)}.slot.v3{transform:translate(62%,0) rotate(6deg)}
.slot.win{box-shadow:0 0 0 3px var(--gold);border-radius:9px}
.msg{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:13.5px;color:var(--muted);pointer-events:none}
/* kart */
.card{position:relative;width:100%;height:100%;background:var(--card);border:1px solid var(--edge);border-radius:8px;color:var(--black);box-shadow:0 2px 6px rgba(0,0,0,.28)}
.card.r{color:var(--red)}
.card .ix{position:absolute;left:5%;top:3%;display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:calc(var(--w)*.27)}
.card .ix i{font-style:normal;font-family:var(--suit);font-size:calc(var(--w)*.24);margin-top:1px}
.card .big{position:absolute;right:8%;bottom:6%;font-family:var(--suit);font-size:calc(var(--w)*.5);line-height:1}
.card .fc{position:absolute;right:9%;bottom:7%;font-weight:700;font-size:calc(var(--w)*.36);line-height:1;opacity:.92}
.card .fc i{font-style:normal;font-family:var(--suit);font-size:calc(var(--w)*.3)}
/* ben */
.me{display:flex;align-items:center;gap:10px;padding:2px 2px 4px}
.me .av{width:40px;height:40px;font-size:17px}
.me .info{flex:1;min-width:0}
.me .acts{display:flex;gap:6px}
.hand{position:relative;height:calc(var(--ch) + 22px);touch-action:none;margin-bottom:2px}
.hand .hc{position:absolute;bottom:0;width:var(--cw);height:var(--ch);--w:var(--cw);transition:transform .18s,filter .18s,left .25s}
.hand .hc.sel{transform:translateY(-20px)}
.hand .hc.dim .card{filter:brightness(.62) saturate(.6)}
.hand.myturn .hc:not(.dim) .card{box-shadow:0 2px 8px rgba(0,0,0,.3),0 0 0 2px rgba(232,200,106,.55)}
.hand .hc.deal{animation:dealIn .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes dealIn{from{opacity:0;transform:translate(0,-160px) scale(.6) rotate(-14deg)}}
.slot .card{--w:var(--tw)}
.drag{position:fixed;z-index:50;pointer-events:none;width:var(--cw);height:var(--ch);--w:var(--cw);transform:translate(-50%,-60%) rotate(-4deg)}
/* paneller */
.ov{position:fixed;inset:0;z-index:40;background:rgba(6,14,10,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{background:#f7f3ea;color:#22201b;border-radius:16px;width:min(440px,100%);max-height:calc(100% - 10px);overflow:auto;padding:18px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet p{margin:6px 0;color:#4d483f;font-size:14px}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:11px;padding:12px 10px;background:#e7e0d1;color:#22201b;font-weight:500;font-size:15px}
.btn.pri{background:#2f6b4f;color:#fff}
.btn:disabled{opacity:.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border:1px solid #d9d1bf;background:#fff;border-radius:12px;padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:15px}
.opt small{color:#6a6458;font-size:12px}
.opt.koz{background:#fff6dc;border-color:#e2c56d}
.opt:disabled{opacity:.38}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.suits button{border:1px solid #d9d1bf;background:#fff;border-radius:12px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.suits button i{font-style:normal;font-family:var(--suit);font-size:30px;line-height:1}
.suits button.r i{color:var(--red)}
.seg{display:flex;background:#e7e0d1;border-radius:11px;padding:3px;margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:14px;color:#3b372f}
.seg button.on{background:#fff;color:#16130e;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7a7365;margin-top:14px;font-weight:600}
.mini{max-height:118px;overflow:hidden;margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.mini .mc{width:34px;height:48px;--w:34px}
table.sc{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.sc th,table.sc td{padding:5px 4px;text-align:right;border-bottom:1px solid #e3dccd;white-space:nowrap}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc td.neg{color:#b23a2c}table.sc td.pos{color:#2d7a4b}
table.sc tr.tot td{font-weight:700;border-top:2px solid #cfc6b3}
.rank{list-style:none;padding:0;margin:10px 0 0}
.rank li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:9px;background:#efe9dc;margin-bottom:5px;font-size:15px}
.rank li:first-child{background:#f6e3a8;font-weight:700}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;background:rgba(10,20,15,.9);color:#fff;padding:9px 15px;border-radius:12px;font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .3s;max-width:90vw;text-align:center}
.lnk{display:flex;gap:6px;margin-top:8px}
.lnk input{flex:1;min-width:0;border:1px solid #d9d1bf;border-radius:10px;padding:10px;font-size:13px;background:#fff;color:#222}
.lnk button{border:0;border-radius:10px;background:#2f6b4f;color:#fff;padding:0 14px}
.seats4 li{display:flex;justify-content:space-between;padding:9px 11px;border-radius:9px;background:#efe9dc;margin-bottom:5px}
.seats4 li span{color:#7a7365;font-size:13px}
.emo{position:absolute;font-size:30px;z-index:30;pointer-events:none;animation:emo 2.2s ease-out forwards}
@keyframes emo{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.emobar{position:absolute;right:0;bottom:calc(100% + 6px);width:min(340px,calc(100vw - 20px));background:#f7f3ea;color:#22201b;border-radius:14px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:35}
.emobar .er{display:flex;justify-content:space-between}
.emobar .er button{border:0;background:none;font-size:24px;padding:4px}
.emobar .log{max-height:180px;overflow:auto;font-size:13.5px;margin:4px 2px 6px}
.emobar .log div{padding:3px 0;border-bottom:1px solid #e6dfcf}
.emobar .log small{display:block;color:#2f6b4f}
.emobar form{display:flex;gap:6px}
.emobar input{flex:1;min-width:0;border:1px solid #d9d1bf;border-radius:10px;padding:9px;font-size:14px;background:#fff;color:#222}
.emobar form button{border:0;border-radius:10px;background:#2f6b4f;color:#fff;padding:0 12px}
#bEmo.new{box-shadow:0 0 0 2px var(--gold)}
.bub{position:fixed;z-index:31;max-width:170px;background:#fff;color:#222;border-radius:12px;padding:6px 9px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none}
input.name{width:100%;border:1px solid #d9d1bf;border-radius:10px;padding:11px;font-size:15px;margin-top:6px;background:#fff;color:#222}

@media (max-height:480px) and (orientation:landscape){
  .app{--cw:min(9vw,16vh,70px);--tw:min(8vw,17vh,66px)}
  .backs{display:none}
  .seat .av{width:36px;height:36px;font-size:15px}
  .me{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 46px);left:max(10px,env(safe-area-inset-left));z-index:3;background:rgba(0,0,0,.18);border-radius:12px;padding:4px 8px}
  .me .av{width:32px;height:32px;font-size:14px}
  .mid{min-height:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="hb" id="bMenu">Menü</button>
    <div class="t"><b id="hGame">Batak</b><small id="hSub"></small></div>
    <button class="hb" id="bLast" title="Son el">↺</button>
    <button class="hb" id="bScore">Puanlar</button>
  </header>
  <div class="table">
    <div class="seat top" id="s2"></div>
    <div class="seat left" id="s1"></div>
    <div class="mid" id="mid"><div class="msg" id="msg"></div></div>
    <div class="seat right" id="s3"></div>
  </div>
  <div class="me" id="meBox">
    <div class="av" id="meAv">S</div>
    <div class="info"><div class="nm" id="meNm">Sen</div><div class="st" id="meSt"></div></div>
    <div class="acts" style="position:relative"><button class="hb" id="bEmo" hidden>💬</button></div>
  </div>
  <div class="hand" id="hand"></div>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const K=window.BATAK,$=id=>document.getElementById(id);
let botLvl=(()=>{try{return JSON.parse(localStorage.getItem('kh_botlvl'))||'normal'}catch(e){return 'normal'}})();
{const _bp=K.botPlay;K.botPlay=(M,p)=>botLvl==='kolay'&&Math.random()<.55?(()=>{const L=K.legal(M,p);return L[Math.random()*L.length|0]})():_bp(M,p)}
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'},SN={S:'Maça',H:'Kupa',D:'Karo',C:'Sinek'};
const RN=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const BOTN=['Nuri','Rıza','Hamdi'];
const ST={get(k,d){try{const v=localStorage.getItem('batak_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('batak_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('batak_'+k)}catch(e){}}};
const UID=ST.get('uid',null)||(()=>{const u=Math.random().toString(36).slice(2,10);ST.set('uid',u);return u})();
let gmode=ST.get('mode','ihaleli');const MODES={ihaleli:'İhaleli',esli:'Eşli',kozmaca:'Koz Maça'};
let M=null,names=['Sen',...BOTN],me=0,mode='off',human=[true,false,false,false];
let busy=false,shownTid=null,showing=null,sel=null,botT=null,dealSeen=-1,choiceSeen=null,endT=null,ver=0,matchHands=ST.get('hands',11);
const SPD=+(new URLSearchParams(location.search).get('spd')||1);
const myName=()=>(window.KH&&KH.name())||ST.get('name','')||'Sen';
const V=p=>(p-me+4)%4;
const pn=p=>p===me?'Sen':names[p];

/* ---------- kart çizimi ---------- */
function cardEl(c,cls=''){const s=K.cs(c),r=K.cr(c),d=document.createElement('div');d.className='card'+(s==='H'||s==='D'?' r':'')+(cls?' '+cls:'');
  d.innerHTML=`<div class="ix">${RN(r)}<i>${SYM[s]}&#xFE0E;</i></div>`+(r>=11?`<div class="fc">${RN(r)}<i>${SYM[s]}&#xFE0E;</i></div>`:`<div class="big">${SYM[s]}&#xFE0E;</div>`);return d}
function toast(html,ms=2200){const t=$('toast');t.innerHTML=html;t.hidden=false;{const o=$('ov');t.style.top=o&&!o.hidden&&o.style.alignItems==='flex-start'?($('sheet').getBoundingClientRect().bottom+10)+'px':''}t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},ms)}
function fmt(n){return (n>0?'+':'')+n}
function cls(n){return n<0?'neg':n>0?'pos':''}

/* ---------- çizim ---------- */
function render(){if(!M)return;
  const T=M.trump,H=M.high;
  $('hGame').innerHTML=M.mode==='kozmaca'?'<span>Koz Maça</span> <span class="trump"><i style="color:var(--black)">♠&#xFE0E;</i></span>':M.phase==='bid'?'<span>İhale</span>':M.phase==='trump'?'<span>Koz seçiliyor</span>':H?`<span>İhale</span> <span>${esc(pn(H.p))}</span> ${H.v}`+(T?` <span class="trump">· <i style="color:${T==='H'||T==='D'?'var(--red)':'var(--black)'}">${SYM[T]}&#xFE0E;</i></span>`:''):'Batak';
  $('hSub').textContent=`${Math.min(M.deal+(M.phase==='dealEnd'||M.phase==='over'?0:1),M.total)}. el / ${M.total}`;
  for(let p=0;p<4;p++){const v=V(p);const turn=['play','bid','trump'].includes(M.phase)&&M.turn===p&&!busy;
    const b=M.bids?M.bids[p]:null;const bt=M.phase==='bid'||M.phase==='trump'?(b==null?'':b==='pas'?'<span>Pas</span>':`<span>${b}</span>`):(H&&H.p===p?`<span>${M.won?M.won[p]:0}/${H.v}</span>`:`<span>${M.won?M.won[p]:0} el</span>`);
    const st=`<span class="pt ${cls(M.score[p])}">${M.score[p]}</span>${bt}${M.mode==='esli'?`<span style="color:${p%2===me%2?'var(--good)':'var(--bad)'}">${p%2===me%2?(p===me?'':'Ortak'):'Rakip'}</span>`:''}`;
    const cz=H&&H.p===p&&M.phase!=='bid'?'<span class="cz">★</span>':'';
    if(v===0){$('meAv').innerHTML=((mode==='off'?myName():names[p])[0]||'S').toLocaleUpperCase('tr')+cz;$('meNm').textContent=mode==='off'?'Sen':names[p];$('meSt').innerHTML=st;$('meBox').classList.toggle('turn',turn);continue}
    const el=$('s'+v);const n=M.hands?M.hands[p].length:0;
    el.className='seat '+['','left','top','right'][v]+(turn?' turn':'');
    el.innerHTML=`<div class="av">${esc((names[p][0]||'?').toUpperCase())}${cz}</div><div class="nm">${esc(names[p])}</div><div class="st">${st}</div><div class="backs">${'<span></span>'.repeat(Math.min(n,13))}</div>`}
  const mid=$('mid');mid.querySelectorAll('.slot').forEach(x=>x.remove());
  const tr=showing?showing.trick:M.trick||[];
  for(const t of tr){const s=document.createElement('div');s.className='slot v'+V(t.p)+(showing&&showing.w===t.p&&showing.lit?' win':'');s.appendChild(cardEl(t.c));s.dataset.p=t.p;mid.appendChild(s)}
  let m='';
  if(M.phase==='bid')m=M.turn===me?'':`${names[M.turn]} ihale düşünüyor…`;
  else if(M.phase==='trump')m=M.turn===me?'':`${names[M.turn]} koz seçiyor…`;
  else if(M.phase==='play'&&!busy)m=M.turn===me?(M.trick.length?'Sıra sende':'Sıra sende, el açıyorsun'):`${names[M.turn]} düşünüyor…`;
  $('msg').textContent=m;
  renderHand();
}
function renderHand(){const h=$('hand');const cards=M&&M.hands?M.hands[me]:[];const mine=M&&M.phase==='play'&&M.turn===me&&!busy;
  const L=mine?K.legal(M,me):[];h.classList.toggle('myturn',mine);
  const W=h.clientWidth,cw=h.querySelector('.hc')?.offsetWidth||Math.min(innerWidth*.17,innerHeight*.096,84);
  const n=cards.length,step=n>1?Math.min(cw*.72,(W-cw)/(n-1)):0,x0=(W-(cw+step*(n-1)))/2;
  const fresh=M&&dealSeen!==M.deal&&M.phase!=='dealEnd'&&M.phase!=='over';if(fresh)dealSeen=M.deal;
  h.innerHTML='';cards.forEach((c,i)=>{const d=document.createElement('div');d.className='hc'+(mine&&!L.includes(c)?' dim':'')+(sel===c?' sel':'')+(fresh?' deal':'');
    d.style.left=(x0+i*step)+'px';if(fresh)d.style.animationDelay=(i*45)+'ms';d.dataset.c=c;d.appendChild(cardEl(c));h.appendChild(d)});
}

/* ---------- oyun akışı ---------- */
function isBot(p){if(mode==='guest')return false;if(!human[p])return true;return mode==='host'&&p!==0&&away(p)}
function sync(fromNet){if(!M)return;
  if(M.last&&M.last.id!==shownTid){
    if(shownTid===null&&fromNet==='first'){shownTid=M.last.id}
    else{shownTid=M.last.id;showTrick(M.last);return}}
  render();afterRender()}
function showTrick(last){KSfx.play('card');setTimeout(()=>KSfx.play('trick'),450/SPD);sfxK=M.deal*1000+(M.tricks||0)*5;busy=true;showing={trick:last.trick,w:last.w,lit:false};render();
  setTimeout(()=>{showing.lit=true;render()},420/SPD);
  setTimeout(()=>{const v=V(last.w),dx=[0,-1,0,1][v]*160,dy=[1,0,-1,0][v]*190;
    $('mid').querySelectorAll('.slot').forEach(s=>{s.style.transform=`translate(${dx}px,${dy}px) scale(.5)`;s.style.opacity=0});},1150/SPD);
  setTimeout(()=>{busy=false;showing=null;sel=null;render();afterRender()},1600/SPD)}
let sfxK=null;

function showLobby(){if(mode==='host'&&started)return;if(mode!=='host'&&mode!=='guest')return;const L=mode==='host'?lobbyNames():(showLobby.names||[]);const n=L.filter(Boolean).length;
  const s=ov('lobby',`<h2>${mode==='host'?'Masa hazır':'Masaya oturdun'}</h2>
    ${mode==='host'?`<p>Bu linki arkadaşlarına gönder. Herkes gelince başlat; boş yerlere bilgisayar oturur.</p><div class="lnk"><input id="lk" readonly value="${linkFor(room||'')}"><button id="lkC">Kopyala</button></div>${window.KH?'<div class="row" style="margin-top:8px"><button class="btn" id="lkF">👥 Arkadaşlarını çağır</button></div>':''}`:'<p>Ev sahibi oyunu başlatınca kartlar dağıtılacak.</p>'}
    ${quick&&mode==='host'?'<p><b>Oyuncu aranıyor…</b> Masa dolunca ya da 2. kişi geldikten 20 saniye sonra oyun kendiliğinden başlar.</p>':''}<p class="lbl">Oyuncular</p><ul class="rank seats4" style="margin-top:6px">${[0,1,2,3].map(i=>`<li><b>${L[i]||'Boş'}</b><span>${i===0?'Ev sahibi':L[i]?'Hazır':'Bilgisayar oturacak'}</span></li>`).join('')}</ul>
    <div class="row"><button class="btn" id="lBack">Çık</button>${mode==='host'?`<button class="btn pri" id="lGo" ${n<2?'disabled':''}>Başlat (${n} kişi)</button>`:''}</div>`);
  if($('lkF'))$('lkF').onclick=()=>KH.invitePicker('Batak',linkFor(room));
  if($('lkC'))$('lkC').onclick=async()=>{const v=$('lk').value;try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({title:'Batak',url:v});return}await navigator.clipboard.writeText(v);toast('Link kopyalandı')}catch(e){$('lk').select();document.execCommand&&document.execCommand('copy');toast('Link kopyalandı')}};
  $('lBack').onclick=()=>{leaveOnline();mode='off';M=null;history.replaceState(null,'',location.pathname);showMenu()};
  if($('lGo'))$('lGo').onclick=startOnline}
function startOnline(){if(window.KQuick)KQuick.update({started:true});quick=false;started=true;me=0;let b=0;names=seats.map((s,i)=>s?s.name:BOTN[b++]);human=seats.map(s=>!!s);
  M=K.newMatch({hands:matchHands,mode:gmode,first:(Math.random()*4)|0});K.startDeal(M);shownTid=null;dealSeen=-1;choiceSeen=null;ver++;$('bEmo').hidden=false;hideOv();bcastState();sync()}
function joinRoom(code){leaveOnline();mode='guest';room=code;started=false;M=null;
  if(!ST.get('name','')){const s=ov('join',`<h2>Batak masasına davet</h2><p>Adını yaz ve masaya otur.</p><input class="name" id="jName" maxlength="14" placeholder="Adını yaz"><div class="row"><button class="btn pri" id="jGo">Masaya otur</button></div>`);
    $('jGo').onclick=()=>{ST.set('name',($('jName').value.trim()||'Misafir').slice(0,14));joinRoom(code)};return}
  ov('lobby','<h2>Bağlanılıyor…</h2><p>Masaya bağlanıyorsun, birkaç saniye sürebilir.</p>');
  peer=new Peer();peer.on('open',connectHost);
  peer.on('error',e=>{if(e.type==='peer-unavailable'){ov('lobby','<h2>Masa bulunamadı</h2><p>Ev sahibinin sayfası kapalı olabilir. Linki tekrar iste.</p><div class="row"><button class="btn pri" id="nf">Menüye dön</button></div>');$('nf').onclick=()=>{leaveOnline();mode='off';showMenu()}}});
  clearInterval(hb);hb=setInterval(()=>{if(mode!=='guest')return;send({t:'ping',uid:UID});if(lastRx&&Date.now()-lastRx>9000){lastRx=Date.now();connectHost()}},3000)}
function connectHost(){if(!peer)return;try{conn&&conn.close()}catch(e){}
  conn=peer.connect(PFX+room);conn.on('open',()=>conn.send({t:'hello',uid:UID,name:myName()}));conn.on('data',guestRecv)}
function guestRecv(d){lastRx=Date.now();if(!d)return;
  if(d.t==='welcome'){me=d.seat}
  else if(d.t==='full'){ov('lobby','<h2>Masa dolu</h2><p>Bu masada 4 kişi var.</p><div class="row"><button class="btn pri" id="nf">Menüye dön</button></div>');$('nf').onclick=()=>{leaveOnline();mode='off';showMenu()}}
  else if(d.t==='lobby'){showLobby.names=d.seats;if(!started)showLobby()}
  else if(d.t==='state'){if(d.ver<ver)return;const first=!started||!M;if(M&&d.M.deal===0&&M.deal>0&&d.M.phase==='bid'){shownTid=null;dealSeen=-1;choiceSeen=null;showDealEnd.counted=false}
    ver=d.ver;M=d.M;names=d.names;human=d.human;started=true;KTimer.remote(tkey(),d.tl);$('bEmo').hidden=false;if(['lobby','join'].includes($('sheet').dataset.k))hideOv();sync(first?'first':true)}
  else if(d.t==='emo')showEmo(d.p,d.e)
  else if(d.t==='chat'&&d.p!==me)addChat(d.p,d.x,d.l)}
function leaveOnline(){if(window.KQuick)KQuick.stop();quick=false;clearInterval(hb);try{peer&&peer.destroy()}catch(e){}peer=null;conn=null;conns={};started=false;$('bEmo').hidden=true}
/* emoji */
const EMO=['👍','😂','😮','😡','🙏','👏'];
/* sohbet: herkes kendi dilinde yazar, gelen mesaj okuyanın diline çevrilir */
const CHAT=[];const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const myL=()=>String(window.LANG||navigator.language||'tr').slice(0,2).toLowerCase();
async function translate(text,hint){const L=myL();const sl='auto';
  try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+L+'&dt=t&q='+encodeURIComponent(text));const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]).join(''),src=j[2];if(src&&src!==L&&out&&out.trim().toLowerCase()!==text.trim().toLowerCase())return out;return null}
  catch(e){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+(hint&&hint!==L?hint:'autodetect')+'|'+L);const j=await r.json();const out=j&&j.responseData&&j.responseData.translatedText;
    if(out&&out.trim().toLowerCase()!==text.trim().toLowerCase()&&!/INVALID|MYMEMORY/i.test(out))return out}catch(x){}return null}}
function bubble(p,t){const v=V(p),el=v===0?$('meAv'):$('s'+v).querySelector('.av');if(!el)return;document.querySelectorAll('.bub[data-p="'+p+'"]').forEach(x=>x.remove());
  const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='bub';b.dataset.p=p;b.textContent=t.length>70?t.slice(0,68)+'…':t;document.body.appendChild(b);
  const w=b.offsetWidth;b.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';b.style.top=(v===0?r.top-b.offsetHeight-8:r.bottom+6)+'px';setTimeout(()=>b.remove(),3800)}
async function addChat(p,x,l){const it={p,x,tr:null};CHAT.push(it);if(CHAT.length>60)CHAT.shift();bubble(p,x);
  if(p!==me&&!document.querySelector('.emobar'))$('bEmo').classList.add('new');drawChat();
  if(p!==me){const t=await translate(x,l);if(t){it.tr=t;drawChat();bubble(p,t)}}}
function drawChat(){const l=document.querySelector('.emobar .log');if(!l)return;
  l.innerHTML=CHAT.map(c=>`<div><b>${esc(pn(c.p))}:</b> ${esc(c.x)}${c.tr?`<small>${esc(c.tr)}</small>`:''}</div>`).join('')||'<div style="color:#7a7365">Mesajlar karşı tarafın diline otomatik çevrilir.</div>';l.scrollTop=1e6}
function sendChat(x){x=String(x||'').trim().slice(0,140);if(!x)return;const l=myL();if(mode==='host'){bcast({t:'chat',p:0,x,l});addChat(0,x,l)}else{send({t:'chat',uid:UID,x,l});addChat(me,x,l)}}
$('bEmo').onclick=e=>{e.stopPropagation();let b=document.querySelector('.emobar');if(b){b.remove();return}$('bEmo').classList.remove('new');
  b=document.createElement('div');b.className='emobar';b.innerHTML=`<div class="er">${EMO.map(x=>`<button type="button">${x}</button>`).join('')}</div><div class="log"></div><form><input maxlength="140" placeholder="Mesaj yaz…"><button>Gönder</button></form>`;
  $('bEmo').parentNode.appendChild(b);drawChat();
  b.querySelectorAll('.er button').forEach(x=>x.onclick=()=>{b.remove();if(mode==='host'){bcast({t:'emo',p:0,e:x.textContent});showEmo(0,x.textContent)}else send({t:'emo',uid:UID,e:x.textContent})});
  b.querySelector('form').onsubmit=ev=>{ev.preventDefault();const i=b.querySelector('input');sendChat(i.value);i.value=''}};
function showEmo(p,e){const v=V(p),el=v===0?$('meAv'):$('s'+v).querySelector('.av');if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='emo';d.textContent=e;
  d.style.position='fixed';d.style.left=(r.left+r.width/2-15)+'px';d.style.top=(r.top-34)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}

addEventListener('resize',()=>M&&renderHand());
/* başlangıç */

/* ---------- hızlı oyun: açık masaya otur ya da masa aç ---------- */
let quick=false,quickAt=0,quick2=0;
function quickPlay(){if(myName()==='Sen'){const s=ov('qname',`<h2>⚡ Hızlı oyun</h2><p>Adını yaz, sana masa bulalım.</p><input class="name" id="qN" maxlength="14" placeholder="Adını yaz"><div class="row"><button class="btn" id="qB">Geri</button><button class="btn pri" id="qG">Masa bul</button></div>`);
    $('qB').onclick=showMenu;$('qG').onclick=()=>{const v=$('qN').value.trim().slice(0,14);if(!v)return;ST.set('name',v);quickPlay()};return}
  if(mode!=='off')leaveOnline();
  ov('lobby','<h2>Masa aranıyor…</h2><p>Açık bir masa varsa oturtuyoruz, yoksa sana yeni masa açıyoruz.</p><div class="row"><button class="btn" id="qC">Vazgeç</button></div>');$('qC').onclick=()=>{leaveOnline();mode='off';showMenu()};
  KQuick.find('batak',{onJoin:c=>joinRoom(c),onHost:()=>{hostRoom();quick=true;quickAt=Date.now();quick2=0;KQuick.advertise('batak',room,{n:1,max:4});showLobby()}})}
function quickTick(){if(!quick||mode!=='host'||started)return;const n=lobbyNames().filter(Boolean).length;KQuick.update({n});
  if(n>=2&&!quick2)quick2=Date.now();if(n<2)quick2=0;
  if(n>=4||(n>=2&&Date.now()-quick2>20000)){startOnline();return}
  if(n===1){const r=KQuick.rival('batak',room);if(r){leaveOnline();joinRoom(r)}}}
/* online hamle süresi */
const tkey=()=>M&&['play','bid','trump','choose'].includes(M.phase)?[M.phase,M.turn,M.chooser,M.deal,M.tricks,(M.trick||[]).length].join(':'):null;
KTimer.init({secs:()=>30,key:tkey,actor:()=>M.phase==='choose'?M.chooser:M.turn,isHuman:p=>!!human[p],name:p=>p===me?'Sen':names[p],mode:()=>started&&!busy?mode:'off',
  onExpire:p=>{toast(`<b>${esc(p===me?'Sen':names[p])}</b>: <span>süre doldu</span>`);if(p===me)hideOv();if(M.phase==='bid')act(p,{k:'bid',v:K.botBid(M,p)});else if(M.phase==='trump')act(p,{k:'trump',s:K.botTrump(M,p)});else if(M.phase==='play')act(p,{k:'play',c:K.botPlay(M,p)})}});
window.KH_HOST=()=>{mode='off';hostRoom();return linkFor(room)};
const hc=(location.hash||'').slice(1).toUpperCase();
if(/^[A-Z0-9]{5}$/.test(hc)){const sv=ST.get('host',null);if(sv&&sv.room===hc&&Date.now()-sv.t<36e5)resumeHost(sv);else joinRoom(hc)}else showMenu();
{const q=new URLSearchParams(location.search);if(q.get('hizli')){try{q.delete('hizli');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}catch(e){}setTimeout(()=>{try{quickPlay()}catch(e){console.error(e)}},400)}}
addEventListener('load',()=>window.KH&&KH.setPresence('Batak'));
</script>
</body></html>
